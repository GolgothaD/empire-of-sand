<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>EMPIRE OF SAND — MzCookie & The Beard</title>
<style>

</style>
<meta name="theme-color" content="#0d0705"><link rel="manifest" href="manifest.json"><link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"></head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  'use strict';

  // =========================================================================
  // MULTI-ASSET SLOTS (Drop custom art into an /assets/ folder next to this
  // HTML file; the engine uses them automatically and falls back to the
  // pre-baked painterly textures if any file isn't present yet.)
  // =========================================================================
  const ASSET_PATHS = {
    sky: 'assets/bg_sky.jpg',
    pyramids: 'assets/bg_far.webp',       // v8: pyramids vista with the sky matted out (sky layer shows behind)
    ground: 'assets/bg_ground.jpg',       // v8: painted ground, perspective baked, seamless 2-tile loop
    fgProps: 'assets/fg_props.webp',
    pillar: 'assets/pillar.webp',
    brazier: 'assets/brazier.webp',
    mzcookiePortrait: 'assets/portrait_mzcookie.jpg',
    thebeardPortrait: 'assets/portrait_thebeard.jpg',
    mzcookie_idle: 'assets/mzcookie_idle.png',
    mzcookie_attack: 'assets/mzcookie_attack.png',
    thebeard_idle: 'assets/thebeard_idle.png',
    thebeard_attack: 'assets/thebeard_attack.png',
    marauder: 'assets/marauder.png',
    shield: 'assets/shield.png',
    zealot: 'assets/zealot.png',
    boss: 'assets/boss.png',
    urn: 'assets/urn.png',
    walk_mzcookie: 'assets/walk_mzcookie.webp',
    walk_thebeard: 'assets/walk_thebeard.webp',
    walk_marauder: 'assets/walk_marauder.webp',
    walk_shield: 'assets/walk_shield.webp',
    walk_zealot: 'assets/walk_zealot.webp',
    walk_boss: 'assets/walk_boss.webp',
    // low-resolution tier for dpr <= ~1.8 (sharper downscale, less memory)
    mzcookie_idle_lo: 'assets/mzcookie_idle_lo.webp',
    mzcookie_attack_lo: 'assets/mzcookie_attack_lo.webp',
    thebeard_idle_lo: 'assets/thebeard_idle_lo.webp',
    thebeard_attack_lo: 'assets/thebeard_attack_lo.webp',
    marauder_lo: 'assets/marauder_lo.webp',
    shield_lo: 'assets/shield_lo.webp',
    zealot_lo: 'assets/zealot_lo.webp',
    boss_lo: 'assets/boss_lo.webp',
    urn_lo: 'assets/urn_lo.webp',
    walk_mzcookie_lo: 'assets/walk_mzcookie_lo.webp',
    walk_thebeard_lo: 'assets/walk_thebeard_lo.webp',
    walk_marauder_lo: 'assets/walk_marauder_lo.webp',
    walk_shield_lo: 'assets/walk_shield_lo.webp',
    walk_zealot_lo: 'assets/walk_zealot_lo.webp',
    walk_boss_lo: 'assets/walk_boss_lo.webp'
  };

  // Multi-frame walk cycles (10 frames, 5x2 atlas). Frames are cut from the same painted
  // sprites; 'stride' is the distance (in 768px source units) the body travels per full cycle,
  // so the cycle phase is driven by distance actually moved and planted feet do not slide.
  const WALK_META = {"mzcookie": {"n": 10, "cols": 5, "x0": 0, "y0": 0, "x1": 538, "y1": 768, "ax": 314.1, "ay": 759.6, "stride": 751.2, "srcH": 768}, "thebeard": {"n": 10, "cols": 5, "x0": 4, "y0": 4, "x1": 515, "y1": 768, "ax": 119.5, "ay": 759.5, "stride": 581.8, "srcH": 768}, "marauder": {"n": 10, "cols": 5, "x0": 0, "y0": 4, "x1": 487, "y1": 768, "ax": 70.1, "ay": 759.4, "stride": 356.0, "srcH": 768}, "shield": {"n": 10, "cols": 5, "x0": 0, "y0": 6, "x1": 434, "y1": 764, "ax": 275.1, "ay": 757.5, "stride": 254.0, "srcH": 768}, "zealot": {"n": 10, "cols": 5, "x0": 0, "y0": 5, "x1": 574, "y1": 768, "ax": 51.6, "ay": 758.2, "stride": 423.5, "srcH": 768}, "boss": {"n": 10, "cols": 5, "x0": 0, "y0": 0, "x1": 577, "y1": 768, "ax": 161.3, "ay": 759.2, "stride": 196.0, "srcH": 768}};


  const SPRITE_META = {"mzcookie_idle": {"ax": 0.5839, "ay": 0.9891}, "mzcookie_attack": {"ax": 0.3171, "ay": 0.9884}, "thebeard_idle": {"ax": 0.232, "ay": 0.9889}, "thebeard_attack": {"ax": 0.0765, "ay": 0.9858}, "marauder": {"ax": 0.1439, "ay": 0.9888}, "shield": {"ax": 0.6338, "ay": 0.9863}, "zealot": {"ax": 0.0891, "ay": 0.9873}, "boss": {"ax": 0.2795, "ay": 0.9886}, "urn": {"ax": 0.499, "ay": 0.9842}};

  const IMG = {};
  const LOAD = { total: 0, done: 0, ready: false, bootT: Date.now(), warm: [] };
  // Decide which sprite tier to load first from the expected pixel density (the other tier loads in the background).
  const _vw0 = Math.max(1, window.innerWidth), _vh0 = Math.max(1, window.innerHeight);
  const _dpr0 = Math.min(3, window.devicePixelRatio || 1);
  const _pxs0 = _vw0 / _vh0 >= 1.2 ? _dpr0 * _vh0 / 540 : _dpr0 * _vw0 / 740;
  const BOOT_LO = 124 * _pxs0 <= 230;
  function loadAsset(key, src, counted) {
    // Preferred path: fetch -> Blob -> ImageBitmap. No <img> element is created, so there is no
    // large decoded image left behind for the garbage collector to reclaim mid-fight.
    if (window.createImageBitmap && window.fetch && location.protocol !== 'file:') {
      fetch(src).then(r => { if (!r.ok) throw 0; return r.blob(); })
        .then(b => createImageBitmap(b))
        .then(bm => {
          try { bm.naturalWidth = bm.width; bm.naturalHeight = bm.height; } catch (_) {}
          if (bm.naturalWidth !== bm.width) throw 0;
          IMG[key] = bm; LOAD.warm.push(bm);
          if (counted) { LOAD.done++; if (LOAD.done >= LOAD.total) LOAD.ready = true; }
        })
        .catch(() => loadAssetImg(key, src, counted));
      return;
    }
    loadAssetImg(key, src, counted);
  }
  function loadAssetImg(key, src, counted) {
    const im = new Image();
    im.decoding = 'async';
    const done = (img) => {
      if (img) { IMG[key] = img; LOAD.warm.push(img); }
      if (counted) { LOAD.done++; if (LOAD.done >= LOAD.total) LOAD.ready = true; }
    };
    // Keep a fully decoded ImageBitmap so the browser never re-decodes (or decodes at a
    // reduced scale and again later) when an enemy type first appears on screen.
    const fin = (ok) => {
      if (!ok) { done(null); return; }
      if (window.createImageBitmap) {
        createImageBitmap(im).then(bm => {
          try { bm.naturalWidth = bm.width; bm.naturalHeight = bm.height; } catch (_) {}
          if (bm.naturalWidth !== bm.width) { done(im); return; }
          done(bm);
        }, () => done(im));
      } else done(im);
    };
    im.onerror = () => fin(false);
    im.src = src;
    // Fully decode before the game ever draws it (no first-draw decode hitch on spawn)
    if (im.decode) im.decode().then(() => fin(true), () => fin(false));
    else im.onload = () => fin(true);
  }
  const _later = [];
  for (const [key, src] of Object.entries(ASSET_PATHS)) {
    const isLo = key.endsWith('_lo');
    const sprite = /^(walk_|mzcookie_|thebeard_|marauder|shield|zealot|boss|urn)/.test(key);
    if (sprite && isLo !== BOOT_LO) { _later.push([key, src]); continue; }
    LOAD.total++;
  }
  for (const [key, src] of Object.entries(ASSET_PATHS)) {
    const isLo = key.endsWith('_lo');
    const sprite = /^(walk_|mzcookie_|thebeard_|marauder|shield|zealot|boss|urn)/.test(key);
    if (sprite && isLo !== BOOT_LO) continue;
    loadAsset(key, src, true);
  }
  // other tier: after the game is ready, low priority
  (function loadRest() {
    if (!LOAD.ready && Date.now() - LOAD.bootT < 12000) { setTimeout(loadRest, 400); return; }
    for (const [key, src] of _later) loadAsset(key, src, false);
  })();
  setTimeout(() => { LOAD.ready = true; }, 9000);   // never block the title forever on a failed asset

  const QUALITY = {
    maxDpr: 3,
    dprCap: Math.min(3, window.devicePixelRatio || 1),
    bloom: true,
    grade: true,
    particleMul: 1,
    fxMul: 1
  };
  const _frameTimes = [];
  let _perfClock = 0;
  let PERF_SKIP = false, _perfSkip2 = false;   // frames that did one-off baking work are not evidence of a slow device
  function notePerf(dt) {
    if (PERF_SKIP) { PERF_SKIP = false; _perfSkip2 = true; return; }   // this frame and the next (whose dt carries the cost)
    if (_perfSkip2) { _perfSkip2 = false; return; }
    _perfClock += dt;
    _frameTimes.push(dt);
    if (_frameTimes.length > 120) _frameTimes.shift();
    if (_perfClock < 1.2 || _frameTimes.length < 45) return;
    _perfClock = 0.0001;   // evaluate once per window (not every frame), one resize at most
    if (gameState === 'playing' && (worldTime - lastSpawnT) < 3) return;   // never resize right around a wave
    let sum = 0;
    for (let i = 0; i < _frameTimes.length; i++) sum += _frameTimes[i];
    const fps = 1 / (sum / _frameTimes.length);
    const native = window.devicePixelRatio || 1;
    const apply = () => {
      QUALITY.bloom = QUALITY.dprCap >= 1.9;
      QUALITY.particleMul = QUALITY.dprCap >= 1.6 ? 1 : 0.55;
      QUALITY.fxMul = QUALITY.dprCap >= 2 ? 1 : 0.7;
      _frameTimes.length = 0;
      resize();
    };
    if (fps < 55 && QUALITY.dprCap > 1.05) {
      // pixel cost ~ dpr^2: jump straight to the density that should hold ~58 fps
      const target = QUALITY.dprCap * Math.sqrt(Math.max(0.2, fps / 62));
      QUALITY.dprCap = Math.max(1, Math.min(QUALITY.dprCap - 0.25, Math.round(target * 20) / 20));
      QUALITY.dropped = true;
      apply();
    } else if (!QUALITY.dropped && fps > 58 && worldTime > 12 && QUALITY.dprCap + 0.01 < Math.min(QUALITY.maxDpr, native)) {
      QUALITY.dprCap = Math.min(QUALITY.maxDpr, native, QUALITY.dprCap + 0.25);
      apply();
    }
  }
  let lastSpawnT = -99;
  const bloomCV = document.createElement('canvas');
  const bloomCTX = bloomCV.getContext('2d');
  const bloomCV2 = document.createElement('canvas');
  const bloomCTX2 = bloomCV2.getContext('2d');

  // =========================================================================
  // CANVAS & RESPONSIVE VIEWPORT
  // =========================================================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });

  let vw = 960, vh = 540, dpr = 1;
  let W = 960, H = 540;
  let LANE_TOP = 310, LANE_BOT = 490;
  let isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  let showTouchUI = true;   // control bubbles show on every device; labels follow the last input used
  let inputMode = isTouchDevice ? 'touch' : 'keyboard';   // 'touch' | 'keyboard' | 'gamepad'

  function resize() {
    vw = Math.max(1, window.innerWidth);
    vh = Math.max(1, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, QUALITY.dprCap || 3);
    canvas.width = Math.round(vw * dpr);
    canvas.height = Math.round(vh * dpr);

    const aspect = vw / vh;
    if (aspect >= 1.2) {
      H = 540;
      W = Math.round(H * aspect);
      LANE_TOP = Math.round(H * 0.56);
      LANE_BOT = Math.round(H * 0.90);
    } else {
      W = 740;
      H = Math.round(W / Math.max(0.48, aspect));
      LANE_TOP = Math.round(H * 0.44);
      LANE_BOT = Math.round(H * 0.69);
    }
    layoutTouchButtons();
  }

  // =========================================================================
  // WEB AUDIO PROCEDURAL SFX
  // =========================================================================
  const AudioFX = (() => {
    let ac = null;
    let muted = false;
    let noiseBuf = null;
    function unlock() {
      if (muted) return;
      try {
        if (!ac) {
          ac = new (window.AudioContext || window.webkitAudioContext)();
          const len = Math.floor(ac.sampleRate * 1.2);
          noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        }
        if (ac.state === 'suspended') ac.resume();
      } catch (_) {}
    }
    function tone(type, f0, f1, dur, gainVal) {
      if (muted || !ac) return;
      try {
        const now = ac.currentTime;
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, now);
        osc.frequency.exponentialRampToValueAtTime(Math.max(25, f1), now + dur);
        g.gain.setValueAtTime(gainVal, now);
        g.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(g); g.connect(ac.destination);
        osc.start(now); osc.stop(now + dur);
      } catch (_) {}
    }
    function noise(dur, gainVal, lpFreq = 1200) {
      if (muted || !ac) return;
      try {
        if (!noiseBuf) return;
        const src = ac.createBufferSource();
        src.buffer = noiseBuf;
        const flt = ac.createBiquadFilter();
        flt.type = 'lowpass'; flt.frequency.value = lpFreq;
        const g = ac.createGain();
        g.gain.setValueAtTime(gainVal, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        src.connect(flt); flt.connect(g); g.connect(ac.destination);
        src.start(0, Math.random() * Math.max(0, 1.2 - dur - 0.02), dur + 0.02);
      } catch (_) {}
    }
    return {
      unlock,
      toggleMute() { muted = !muted; },
      isMuted() { return muted; },
      swing(heavy) { noise(heavy ? 0.16 : 0.09, heavy ? 0.16 : 0.1, heavy ? 900 : 1800); tone('triangle', heavy ? 210 : 380, heavy ? 85 : 160, heavy ? 0.14 : 0.08, 0.08); },
      hit(heavy) { noise(heavy ? 0.18 : 0.1, heavy ? 0.25 : 0.16, heavy ? 700 : 1100); tone('sawtooth', heavy ? 140 : 220, 42, heavy ? 0.18 : 0.1, heavy ? 0.18 : 0.11); },
      clang() { tone('square', 920, 480, 0.14, 0.12); tone('triangle', 1480, 720, 0.16, 0.09); },
      shatter() { noise(0.26, 0.26, 2600); tone('sawtooth', 520, 90, 0.24, 0.14); },
      dodge() { noise(0.12, 0.08, 2200); tone('sine', 420, 780, 0.11, 0.07); },
      swap() { tone('triangle', 320, 680, 0.14, 0.11); tone('sine', 540, 960, 0.18, 0.08); },
      ult() { noise(0.5, 0.28, 950); tone('sawtooth', 160, 52, 0.5, 0.2); tone('triangle', 620, 180, 0.45, 0.12); },
      heal() { tone('sine', 520, 880, 0.16, 0.1); setTimeout(() => tone('sine', 680, 1180, 0.18, 0.1), 70); },
      bossRoar() { noise(0.55, 0.24, 520); tone('sawtooth', 110, 44, 0.55, 0.22); }
    };
  })();

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (_) {}
  }

  // =========================================================================
  // PRE-BAKED PAINTERLY TEXTURES (Generated once on startup for locked 60 FPS)
  // =========================================================================
  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    return c;
  }

  const TEX = {};

  function bakeTextures() {
    // 1. Swirling Apocalyptic Fire Vortex Sky
    const sky = makeCanvas(1024, 360);
    const sctx = sky.getContext('2d');
    const sg = sctx.createLinearGradient(0, 0, 0, 360);
    sg.addColorStop(0, '#2a0803');
    sg.addColorStop(0.32, '#7d1c06');
    sg.addColorStop(0.68, '#d4520c');
    sg.addColorStop(1, '#f4a236');
    sctx.fillStyle = sg;
    sctx.fillRect(0, 0, 1024, 360);

    // Painterly vortex arcs
    const vx = 650, vy = 105;
    for (let i = 0; i < 65; i++) {
      const r = 28 + i * 7.8;
      const a0 = (i * 0.45) % (Math.PI * 2);
      const a1 = a0 + 1.1 + (i % 4) * 0.35;
      sctx.strokeStyle = i % 3 === 0
        ? `rgba(255, 210, 115, ${0.14 + (i % 5) * 0.02})`
        : i % 2 === 0
        ? `rgba(210, 58, 12, 0.18)`
        : `rgba(55, 10, 4, 0.22)`;
      sctx.lineWidth = 4 + (i % 6) * 2.4;
      sctx.beginPath();
      sctx.ellipse(vx, vy, r * 1.45, r * 0.58, -0.22, a0, a1);
      sctx.stroke();
    }
    // Glowing core
    const cg = sctx.createRadialGradient(vx, vy, 8, vx, vy, 230);
    cg.addColorStop(0, 'rgba(255, 240, 185, 0.85)');
    cg.addColorStop(0.35, 'rgba(255, 145, 35, 0.45)');
    cg.addColorStop(1, 'rgba(255, 80, 10, 0)');
    sctx.fillStyle = cg;
    sctx.fillRect(0, 0, 1024, 360);

    // Brushstroke cloud wisps
    for (let i = 0; i < 110; i++) {
      const cx = Math.random() * 1024;
      const cy = Math.random() * 290;
      const rw = 40 + Math.random() * 140;
      const rh = 6 + Math.random() * 20;
      sctx.fillStyle = Math.random() > 0.45
        ? `rgba(42, 8, 3, ${0.12 + Math.random() * 0.18})`
        : `rgba(255, 180, 75, ${0.08 + Math.random() * 0.12})`;
      sctx.beginPath();
      sctx.ellipse(cx, cy, rw, rh, (Math.random() - 0.5) * 0.25, 0, Math.PI * 2);
      sctx.fill();
    }
    TEX.sky = sky;

    // 2. Rim-Lit Pyramids & Distant Colonnades
    const pyr = makeCanvas(1280, 320);
    const pctx = pyr.getContext('2d');
    function drawPyramid(x, baseW, h, darkShade) {
      const peakX = x + baseW * 0.5;
      const peakY = 300 - h;
      // Lit right face
      const lg = pctx.createLinearGradient(peakX, peakY, x + baseW, 300);
      lg.addColorStop(0, '#f3ad4a');
      lg.addColorStop(0.45, '#b65b22');
      lg.addColorStop(1, '#58240f');
      pctx.fillStyle = lg;
      pctx.beginPath();
      pctx.moveTo(peakX, peakY);
      pctx.lineTo(x + baseW, 300);
      pctx.lineTo(peakX - baseW * 0.08, 300);
      pctx.closePath();
      pctx.fill();

      // Shadow left face
      const dg = pctx.createLinearGradient(x, 300, peakX, peakY);
      dg.addColorStop(0, darkShade);
      dg.addColorStop(1, '#6b2c12');
      pctx.fillStyle = dg;
      pctx.beginPath();
      pctx.moveTo(peakX, peakY);
      pctx.lineTo(x, 300);
      pctx.lineTo(peakX - baseW * 0.08, 300);
      pctx.closePath();
      pctx.fill();

      // Stone block striations
      pctx.strokeStyle = 'rgba(30, 10, 4, 0.22)';
      pctx.lineWidth = 1.4;
      for (let y = peakY + 18; y < 298; y += 14) {
        const t = (y - peakY) / h;
        pctx.beginPath();
        pctx.moveTo(peakX - baseW * 0.5 * t, y);
        pctx.lineTo(peakX + baseW * 0.5 * t, y);
        pctx.stroke();
      }
      // Golden rim highlight
      pctx.strokeStyle = 'rgba(255, 224, 145, 0.55)';
      pctx.lineWidth = 2.5;
      pctx.beginPath();
      pctx.moveTo(peakX, peakY);
      pctx.lineTo(x + baseW, 300);
      pctx.stroke();
    }
    drawPyramid(60, 340, 200, '#3a1609');
    drawPyramid(390, 470, 275, '#2b0f06');
    drawPyramid(830, 360, 215, '#3b170a');

    // Distant sandstone temple colonnade silhouettes
    pctx.fillStyle = '#3e180a';
    for (let x = 20; x < 1260; x += 26) {
      if ((x > 330 && x < 410) || (x > 790 && x < 860)) continue;
      const colH = 52 + ((x * 17) % 36);
      pctx.fillRect(x, 305 - colH, 11, colH);
      pctx.fillStyle = 'rgba(255, 185, 90, 0.26)';
      pctx.fillRect(x + 8, 305 - colH, 3, colH);
      pctx.fillStyle = '#3e180a';
    }
    // Dune ridge across bottom
    const dg2 = pctx.createLinearGradient(0, 255, 0, 320);
    dg2.addColorStop(0, 'rgba(218, 128, 48, 0.85)');
    dg2.addColorStop(1, '#6f3213');
    pctx.fillStyle = dg2;
    pctx.beginPath();
    pctx.moveTo(0, 295);
    for (let x = 0; x <= 1280; x += 80) {
      pctx.lineTo(x, 286 + Math.sin(x * 0.012) * 10);
    }
    pctx.lineTo(1280, 320); pctx.lineTo(0, 320);
    pctx.closePath();
    pctx.fill();
    TEX.pyramids = pyr;

    // 3. Tileable Painterly Sandstone Ground
    const gnd = makeCanvas(512, 260);
    const gctx = gnd.getContext('2d');
    const gg = gctx.createLinearGradient(0, 0, 0, 260);
    gg.addColorStop(0, '#a65724');
    gg.addColorStop(0.12, '#c87735');
    gg.addColorStop(0.55, '#9d5321');
    gg.addColorStop(1, '#4b200c');
    gctx.fillStyle = gg;
    gctx.fillRect(0, 0, 512, 260);

    // Carved temple kerb along top edge
    gctx.fillStyle = '#6f3514';
    gctx.fillRect(0, 0, 512, 22);
    for (let x = 0; x < 512; x += 64) {
      gctx.fillStyle = x % 128 === 0 ? '#b96e32' : '#9c5623';
      gctx.fillRect(x + 2, 2, 60, 16);
      gctx.fillStyle = 'rgba(255, 212, 130, 0.32)';
      gctx.fillRect(x + 2, 2, 60, 3);
      gctx.strokeStyle = 'rgba(40, 15, 5, 0.5)';
      gctx.strokeRect(x + 2, 2, 60, 16);
    }

    // Painterly sandstone grain, cracked tiles, and wind-blown sand streaks
    for (let i = 0; i < 320; i++) {
      const rx = Math.random() * 512;
      const ry = 24 + Math.random() * 234;
      const rw = 10 + Math.random() * 44;
      const rh = 2 + Math.random() * 6;

  function toLogical(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: ((clientX - r.left) / Math.max(1, r.width)) * W,
      y: ((clientY - r.top) / Math.max(1, r.height)) * H
    };

    e.preventDefault();
    AudioFX.unlock();
    if (e.pointerType === 'touch' || e.pointerType === 'pen') { showTouchUI = true; inputMode = 'touch'; }
    const p = toLogical(e.clientX, e.clientY);

    // Check top-right HUD utility buttons
    for (const hb of hudBtns) {
      if (p.x >= hb.x && p.x <= hb.x + hb.w && p.y >= hb.y && p.y <= hb.y + hb.h) {
        if (hb.id === 'touchToggle') showTouchUI = !showTouchUI;
        if (hb.id === 'muteToggle') AudioFX.toggleMute();

      }
    }

    // Start / Restart screen tap
    if (gameState !== 'playing') {
      startGame();
      return;
    }

    // Right-side arcade buttons (generous hit radius for zero-miss response)
    if (showTouchUI) {
      let bestBtn = null, bestD = Infinity;
      for (const b of touchBtns) {
        const d = Math.hypot(p.x - b.x, p.y - b.y);
        if (d <= b.r * 1.32 && d < bestD) { bestD = d; bestBtn = b; }
      }
      if (bestBtn) {
        bestBtn.down = true;
        btnPointers.set(e.pointerId, bestBtn.id);
        bufferAction(bestBtn.id);
        vibrate(10);
        try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
        return;
      }
    }

      stick.id = e.pointerId;
      stick.ox = p.x; stick.oy = p.y;
      stick.cx = p.x; stick.cy = p.y;
      stick.dx = 0; stick.dy = 0;
      try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    }
  }, { passive: false });

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId !== stick.id) return;
    e.preventDefault();
    const p = toLogical(e.clientX, e.clientY);
    const vx = p.x - stick.ox;
    const vy = p.y - stick.oy;
    const dist = Math.hypot(vx, vy);
    const dead = 7;
    if (dist < dead) {
      stick.cx = p.x; stick.cy = p.y;
      stick.dx = 0; stick.dy = 0;
    } else {
      const clamped = Math.min(dist, stick.maxR);
      const nx = vx / dist, ny = vy / dist;
      stick.cx = stick.ox + nx * clamped;
      stick.cy = stick.oy + ny * clamped;
      // Snappy response curve for crisp arcade movement
      const mag = Math.min(1, (dist - dead) / (stick.maxR - dead));
      stick.dx = nx * Math.pow(mag, 0.72);
      stick.dy = ny * Math.pow(mag, 0.72);
    }
  }, { passive: false });

    if (bid) {

  function pollGamepad() {
    padAxis.x = 0; padAxis.y = 0;
    try {
      const pads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = pads && Array.from(pads).find(p => p && p.connected);
      gamepadConnected = !!gp;
      if (!gp) return;

      const ax = gp.axes[0] || 0;
      const ay = gp.axes[1] || 0;
      if (Math.abs(ax) > 0.18) padAxis.x = ax;
      if (Math.abs(ay) > 0.18) padAxis.y = ay;
      if (gp.buttons[14]?.pressed) padAxis.x = -1;
      if (gp.buttons[15]?.pressed) padAxis.x = 1;
      if (gp.buttons[12]?.pressed) padAxis.y = -1;
      if (gp.buttons[13]?.pressed) padAxis.y = 1;

      const pressed = gp.buttons.map(b => !!b.pressed);
      if (pressed.some((p, i) => p && !prevPadBtns[i]) || Math.abs(ax) > 0.5 || Math.abs(ay) > 0.5) inputMode = 'gamepad';
      const just = (i) => pressed[i] && !prevPadBtns[i];

      if (gameState !== 'playing') {
        if (just(0) || just(2) || just(9)) startGame();
      } else {
        if (just(2)) bufferAction('light');               // X
        if (just(3)) bufferAction('heavy');               // Y
        if (just(0)) bufferAction('jump');                // A
        if (just(1)) bufferAction('dodge');               // B
        if (just(4) || just(5)) bufferAction('swap');     // LB / RB
        if (just(6) || just(7)) bufferAction('ult');      // LT / RT
      }
      prevPadBtns = pressed;
    } catch (_) {
      gamepadConnected = false;
    }
  }

    if (keys['KeyW'] || keys['ArrowUp']) my -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) my += 1;

    } else if (Math.abs(padAxis.x) > 0.01 || Math.abs(padAxis.y) > 0.01) {
      mx = padAxis.x; my = padAxis.y;
    }
    const len = Math.hypot(mx, my);
    if (len > 1) { mx /= len; my /= len; }
    return { x: mx, y: my };
  }

  // Move a velocity toward its target: ramp up over ACCEL_T, brake over DECEL_T (reversals brake first).
  function easeVel(v, target, top, dt) {
    if (top <= 0) return target;
    if (v !== 0 && (target === 0 || Math.sign(target) !== Math.sign(v) || Math.abs(target) < Math.abs(v))) {
      const lim = target !== 0 && Math.sign(target) === Math.sign(v) ? target : 0;
      const nv = v - Math.sign(v) * (top / DECEL_T) * dt;
      if (Math.sign(v) > 0 ? nv <= lim : nv >= lim) return lim;
      return nv;
    }
    const nv = v + Math.sign(target) * (top / ACCEL_T) * dt;
    return Math.abs(nv) >= Math.abs(target) ? target : nv;
  }

        maxLife: 0.55,
        size: size * (0.6 + Math.random() * 0.8),
        color
      });
    }
  }

  function addFloatText(x, y, text, color = '#ffd666', size = 18) {
    floatTexts.push({ x, y, text, color, size, life: 0.8, vy: -58 });
  }

  function addSlashArc(x, y, facing, radius, color1, color2, heavy) {
    const a = { x, y, facing, radius, color1, color2, heavy, life: heavy ? 0.22 : 0.15, maxLife: heavy ? 0.22 : 0.15 };
    slashArcs.push(a);
    return a;
  }

  // =========================================================================
  // COMBAT ACTIONS
  // =========================================================================
  function getHero() { return HEROES[player.active]; }
  function getActiveHp() { return roster[player.active]; }

  function doSwap() {
    const other = player.active === 'mzcookie' ? 'thebeard' : 'mzcookie';
    if (roster[other].hp <= 0 || player.swapCd > 0) return;

    player.active = other;
    player.swapCd = 0.55;
    player.state = 'idle';
    player.stateTimer = 0;
    player.invuln = Math.max(player.invuln, 0.35);
    AudioFX.swap();
    vibrate(18);
    spawnParticles(player.x, player.z - 42, 18, HEROES[other].accent, 210, 5);
    addFloatText(player.x, player.z - 98, HEROES[other].name + '!', HEROES[other].accent, 19);

    // Tag-in shockwave knocks nearby foes slightly to extend combos
    for (const e of enemies) {
      if (e.state === 'dead') continue;
      if (Math.abs(e.x - player.x) < 115 && Math.abs(e.z - player.z) < 52) {
        damageEnemy(e, 10, false, player.facing * 130, 'light');
      }
    }
  }

  function doDodge(mv) {
    const h = getHero();
    player.state = 'dodge';
    player.stateDur = 0.24;
    player.stateTimer = 0.24;
    player.invuln = 0.32;
    if (Math.abs(mv.x) > 0.15) player.facing = mv.x > 0 ? 1 : -1;
    AudioFX.dodge();
    vibrate(12);
    spawnParticles(player.x, player.z - 12, 10, h.accent, 150, 3.5);
  }

  // Face the direction being held (or one tapped during the previous swing) when a swing starts.
  function applyAttackFacing() {
    const mv = getMoveVector();
    if (Math.abs(mv.x) > 0.3) player.facing = mv.x > 0 ? 1 : -1;
    else if (player.wantFace && performance.now() - player.wantT < 400) player.facing = player.wantFace;
    player.wantFace = 0;
  }

  function doLight() {
    const h = getHero();
    applyAttackFacing();
    if (player.comboWindow <= 0 || !CHAIN_COMP) player.hitOff = 0;   // a fresh chain starts from where the hero stands
    player.comboStep = player.comboWindow > 0 ? (player.comboStep + 1) % 3 : 0;
    player.state = 'light';
    player.stateDur = h.lightDur[player.comboStep];
    player.stateTimer = player.stateDur;
    player.comboWindow = player.stateDur + 0.38;
    player.hasHitSet.clear();
    player.stepE = 0;
    player.stepTot = player.comboStep === 2 ? STEP_IN.finisher : STEP_IN.light;
    AudioFX.swing(player.comboStep === 2);
    player.arc = addSlashArc(
      player.x + player.facing * 26,
      player.z - player.y - 46,
      player.facing,
      h.reach * (player.comboStep === 2 ? 0.92 : 0.72),
      h.accent, h.accent2, player.comboStep === 2
    );
  }

  function doHeavy() {
    const h = getHero();
    applyAttackFacing();
    if (player.comboWindow <= 0 || !CHAIN_COMP) player.hitOff = 0;
    player.state = 'heavy';
    player.stateDur = h.heavyDur;
    player.stateTimer = player.stateDur;
    player.comboStep = 0;
    player.comboWindow = 0;
    player.hasHitSet.clear();
    player.stepE = 0;
    player.stepTot = player.active === 'thebeard' ? STEP_IN.heavyBeard : STEP_IN.heavyMz;
    AudioFX.swing(true);
    player.arc = addSlashArc(
      player.x + player.facing * 32,
      player.z - player.y - 46,
      player.facing,
      h.reach * 1.05,
      '#fff1a8', h.accent2, true
    );
    // MzCookie heavy fires a piercing Solar Wave projectile
    player.proj = null;
    if (player.active === 'mzcookie') {
      projectiles.push(player.proj = {
        fromPlayer: true,
        x: player.x + player.facing * 42,
        z: player.z,
        vx: player.facing * 520,
        dmg: 22,
        heavy: true,
        life: 0.65,
        color: '#ffbe3b',
        hitSet: new Set()
      });
    }
  }

  function doUltimate() {
    if (player.rage < 100) return;
    const h = getHero();
    player.rage = 0;
    player.state = 'ult';
    player.stateDur = 0.62;
    player.stateTimer = 0.62;
    player.invuln = 0.9;
    player.vx = 0; player.vz = 0;
    hitStop = HITSTOP.ult;
    shakeMag = 16;
    flashAlpha = 0.65;
    flashColor = h.accent;
    AudioFX.ult();
    vibrate([35, 30, 50]);
    rumbleGamepad(0.95, 0.75, 360);
    showBanner(h.name + ': ' + h.ultName + '!', 1.5);

    for (let i = 0; i < 48; i++) {
      spawnParticles(player.x + (Math.random() - 0.5) * 320, player.z - 30 - Math.random() * 90, 1, i % 2 ? h.accent : '#ff3d0a', 340, 6);
    }

    for (const e of enemies) {
      if (e.state === 'dead') continue;
      const dist = Math.abs(e.x - player.x);
      if (dist < 420) {
        if (e.shield) {
          e.shield = false;
          AudioFX.shatter();
          addFloatText(e.x, e.z - 95, 'SHIELD SHATTERED!', '#ff9d3b', 16);
        }
        damageEnemy(e, player.active === 'thebeard' ? 88 : 74, true, (e.x >= player.x ? 1 : -1) * 280, 'ult');
      }
    }
  }

  function damageEnemy(e, dmg, isHeavy, knockX, hsKind) {
    const hs = HITSTOP[hsKind || (isHeavy ? 'heavy' : 'light')];
    if (e.state === 'dead') return;

    // Frontal shield block check (break with Heavy or flank behind)
    const attackedFromFront = (player.x < e.x && e.facing === -1) || (player.x > e.x && e.facing === 1);
    if (e.shield && attackedFromFront) {
      if (isHeavy) {
        e.shield = false;
        spawnShock(e.x, e.z, 1.1);
        AudioFX.shatter();
        hitStop = Math.max(hitStop, HITSTOP.heavy);
        shakeMag = 9;
        spawnParticles(e.x, e.z - 46, 20, '#90a4ae', 240, 5);
        addFloatText(e.x, e.z - 94, 'SHIELD BROKEN!', '#ffae38', 17);
      } else {
        AudioFX.clang();
        setKnock(e, knockX * 0.25);
        spawnParticles(e.x + e.facing * 24, e.z - 46, 10, '#ffe49e', 170, 3);
        addFloatText(e.x, e.z - 88, 'BLOCKED! (USE HVY)', '#cbd5e1', 13);
        return;
      }
    }

    e.hp -= dmg;
    e.hurtFlash = 0.14;
    if (isHeavy) spawnShock(e.x, e.z, e.isBoss ? 1.3 : 1);
    setKnock(e, knockX * (e.isBoss ? 0.35 : 1));
    if (isHeavy && !e.isBoss) e.vy = 210;

    comboCount++;
    comboTimer = 2.4;
    score += dmg * 5;
    player.rage = Math.min(100, player.rage + (isHeavy ? 10 : 6));

    hitStop = Math.max(hitStop, hs);
    shakeMag = Math.max(shakeMag, isHeavy ? 8 : 3.5);
    AudioFX.hit(isHeavy);
    vibrate(isHeavy ? 24 : 11);
    if (isHeavy) rumbleGamepad(0.55, 0.3, 120);

    spawnParticles(e.x, e.z - 46, isHeavy ? 16 : 9, '#ff3b14', isHeavy ? 260 : 180, isHeavy ? 5 : 3.5);
    spawnParticles(e.x, e.z - 46, isHeavy ? 10 : 5, '#ffd466', 220, 3);
    addFloatText(e.x + (Math.random() - 0.5) * 20, e.z - 82, String(dmg), isHeavy ? '#ff8f26' : '#fff0b3', isHeavy ? 22 : 17);

    // Boss Phase 2 Trigger
    if (e.isBoss && e.phase === 1 && e.hp <= e.maxHp * 0.5 && e.hp > 0) {
      e.phase = 2;
      e.speed = 138;
      AudioFX.bossRoar();
      shakeMag = 14;
      flashAlpha = 0.45;
      flashColor = '#ff380a';
      showBanner('PHASE II — WRATH OF THE SUN!', 2.0);
      spawnEnemy('marauder', -1);
      spawnEnemy('zealot', 1);
    }

    if (e.hp <= 0) {
      e.state = 'dead';
      e.timer = 0.55;
      score += e.score;
      spawnParticles(e.x, e.z - 42, 24, '#e63312', 250, 5);
      if (e.isBoss) {
        hitStop = 0.12;
        shakeMag = 18;
        flashAlpha = 0.7;
        flashColor = '#ffd466';
      }
    } else if (!e.isBoss || isHeavy) {
      e.state = 'hurt';
      e.timer = isHeavy ? 0.34 : 0.22;
    }
  }

  function damagePlayer(dmg, knockX) {
    if (player.invuln > 0 || gameState !== 'playing') return;
    const st = getActiveHp();
    st.hp = Math.max(0, st.hp - dmg);
    player.invuln = 0.75;
    player.state = 'hurt';
    player.stateTimer = 0.24;
    player.vx = 0; player.vz = 0;
    player.x = Math.max(camX + 28, Math.min(camX + W - 28, player.x + knockX));
    comboCount = 0;
    shakeMag = 9;
    flashAlpha = 0.28;
    flashColor = '#c9180a';
    AudioFX.hit(true);
    vibrate(32);
    rumbleGamepad(0.7, 0.5, 160);
    spawnParticles(player.x, player.z - 46, 12, '#e62412', 200, 4.5);
    addFloatText(player.x, player.z - 92, '-' + dmg, '#ff4733', 20);

    // Auto-swap if active hero falls and partner still stands
    if (st.hp <= 0) {
      const other = player.active === 'mzcookie' ? 'thebeard' : 'mzcookie';
      if (roster[other].hp > 0) {
        player.active = other;
        player.invuln = 1.3;
        showBanner(HEROES[other].name + ' TAKES THE FRONT!', 1.7);
        spawnParticles(player.x, player.z - 45, 22, HEROES[other].accent, 230, 5);
      } else {
        gameState = 'gameover';
      }
    }
  }

  // =========================================================================
  // UPDATE LOOP
  // =========================================================================
  function update(dt) {
    worldTime += dt;
    pollGamepad();

    // Ambient embers
    updateAmbient(dt);
    for (const em of embers) {
      em.x += em.vx * dt * (1 + AMB.gust * 1.3);
      em.y += em.vy * dt;
      if (em.x < -20) em.x = W + 20;
      if (em.y < -20) em.y = H + 20;
    }

    if (gameState !== 'playing') return;

    if (bannerTimer > 0) bannerTimer -= dt;
    if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 1.9);
    if (shakeMag > 0) shakeMag = Math.max(0, shakeMag - dt * 36);
    if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) comboCount = 0; }

    if (hitStop > 0) { hitStop -= dt; return; }

    const now = performance.now();
    const h = getHero();
    const mv = getMoveVector();

    // Reserve partner passively recovers HP
    const bench = player.active === 'mzcookie' ? 'thebeard' : 'mzcookie';
    if (roster[bench].hp > 0 && roster[bench].hp < roster[bench].maxHp) {
      roster[bench].hp = Math.min(roster[bench].maxHp, roster[bench].hp + dt * 3.8);
    }

    if (player.invuln > 0) player.invuln -= dt;
    if (player.swapCd > 0) player.swapCd -= dt;
    if (player.comboWindow > 0) player.comboWindow -= dt;

    // Input Cancel Windows — responsive feel!
    const canAct = player.state === 'idle' || player.state === 'walk';
    const canCancel = (player.state === 'light' && player.stateTimer < player.stateDur * 0.42);

    if (consumeBuffer('ult', now) && (canAct || canCancel)) {
      doUltimate();
    } else if (consumeBuffer('swap', now) && player.state !== 'hurt' && player.state !== 'ult') {
      doSwap();
    } else if (consumeBuffer('dodge', now) && (canAct || canCancel)) {
      doDodge(mv);
    } else if (consumeBuffer('jump', now) && (player.y === 0 || (!player.jumped && worldTime - player.groundT <= COYOTE_T)) && (canAct || canCancel)) {
      player.vy = h.jumpVel;
      player.jumped = true;
      player.takeT = TAKEOFF_T;
      player.state = 'idle';
      AudioFX.dodge();
    } else if (consumeBuffer('heavy', now) && (canAct || canCancel)) {
      doHeavy();
    } else if (consumeBuffer('light', now) && (canAct || canCancel)) {
      doLight();
    }

    // Player movement & state timers
    if (player.state === 'dodge') {
      player.stateTimer -= dt;
      player.x += player.facing * h.speed * 2.15 * dt;
      player.z += mv.y * h.speed * 0.5 * dt;
      if (Math.random() < 0.65) {
        player.afterimages.push({ x: player.x, z: player.z, y: player.y, facing: player.facing, life: 0.16, col: h.accent });
      }
      if (player.stateTimer <= 0) {
        player.state = 'idle';
        // carry on running if the stick still points the dash direction, otherwise stop clean
        player.vx = mv.x * player.facing > 0.3 ? mv.x * h.speed : 0;
        player.vz = 0;
      }
    } else if (player.state === 'light' || player.state === 'heavy') {
      player.stateTimer -= dt;
      const prog = 1 - (player.stateTimer / Math.max(0.01, player.stateDur));

      // Turn while attacking: flip during wind-up or recovery; during the strike itself the
      // direction is buffered and applied to the next swing.
      if (Math.abs(mv.x) > 0.3) {
        const want = mv.x > 0 ? 1 : -1;
        if (want !== player.facing) {
          if (prog < 0.2 || prog > 0.74) {
            player.facing = want;
            const arc = player.arc;
            if (arc && slashArcs.includes(arc)) { arc.facing = want; arc.x = player.x + want * Math.abs(arc.x - player.x); }
            const pr = player.proj;
            if (pr && prog < 0.2 && projectiles.includes(pr)) { pr.vx = -pr.vx; pr.x = player.x + want * 42; }
            player.wantFace = 0;
          } else { player.wantFace = want; player.wantT = now; }
        } else player.wantFace = 0;
      }
      // eased steering drift + step-in toward the facing (front-loaded, stops short of a foe in front)
      player.vx = easeVel(player.vx, mv.x * h.speed * 0.22, h.speed, dt);
      player.vz = easeVel(player.vz, mv.y * h.speed * 0.66 * 0.3, h.speed * 0.66, dt);
      const sp = Math.min(1, prog / 0.5), se = 1 - (1 - sp) * (1 - sp);
      let step = player.facing * player.stepTot * (se - player.stepE);
      player.stepE = se;
      if (step !== 0) {
        for (const e of enemies) {
          if (e.state === 'dead') continue;
          const ahead = (e.x - player.x) * player.facing;
          if (ahead >= 0 && ahead < 34 && Math.abs(e.z - player.z) <= 44) { step = 0; break; }
        }
      }
      const ddx = player.vx * dt + step;
      player.x += ddx;
      player.z += player.vz * dt;
      // hits are resolved from where the v4 lunge would have put the hero, so connect ranges stay identical
      player.hitOff += ddx - (player.facing * 45 * dt + mv.x * h.speed * 0.22 * dt);
      const hx = player.x - player.hitOff;

      // Active hit window
      if (prog >= 0.22 && prog <= 0.72) {
        const isHvy = player.state === 'heavy' || player.comboStep === 2;
        const dmg = player.state === 'heavy' ? h.heavyDmg : h.lightDmg[player.comboStep];
        const reach = player.state === 'heavy' ? h.reach * 1.15 : h.reach;

        for (const e of enemies) {
          if (e.state === 'dead' || player.hasHitSet.has(e.id)) continue;
          const dx = (e.x - hx) * player.facing;
          const dz = Math.abs(e.z - player.z);
          if (dx >= -24 && dx <= reach && dz <= 44) {
            player.hasHitSet.add(e.id);
            damageEnemy(e, dmg, isHvy, player.facing * (isHvy ? 235 : 95),
              player.state === 'heavy' ? 'heavy' : player.comboStep === 2 ? 'finisher' : 'light');
          }
        }
        // Smash urns
        for (const u of urns) {
          if (u.broken) continue;
          const dx = (u.x - hx) * player.facing;
          if (dx >= -20 && dx <= reach && Math.abs(u.z - player.z) < 42) {
            u.broken = true;
            AudioFX.shatter();
            spawnParticles(u.x, u.z - 22, 14, '#c77c40', 190, 4.5);
            pickups.push({ x: u.x, z: u.z, type: u.drop, bob: 0 });
          }
        }
      }
      if (player.stateTimer <= 0) player.state = 'idle';
    } else if (player.state === 'hurt' || player.state === 'ult') {
      player.stateTimer -= dt;
      player.vx = 0; player.vz = 0; player.hitOff = 0;
      if (player.stateTimer <= 0) player.state = 'idle';
    } else {
      player.vx = easeVel(player.vx, mv.x * h.speed, h.speed, dt);
      player.vz = easeVel(player.vz, mv.y * (h.speed * 0.66), h.speed * 0.66, dt);
      player.x += player.vx * dt;
      player.z += player.vz * dt;
      if (Math.abs(mv.x) > 0.08 || Math.abs(mv.y) > 0.08) player.hitOff = 0;   // steering by hand: hits come from where the hero is
      if (Math.abs(mv.x) > 0.1) player.facing = mv.x > 0 ? 1 : -1;
      const gliding = Math.abs(player.vx) > 6 || Math.abs(player.vz) > 6;
      player.state = (Math.abs(mv.x) > 0.08 || Math.abs(mv.y) > 0.08 || gliding) ? 'walk' : 'idle';
      if (player.state === 'walk') player.animT += dt * 11;
    }

    // Visual turn / skid on any facing change (gameplay facing itself switches immediately)
    if (player.facing !== player.prevFacing) {
      player.prevFacing = player.facing;
      player.turnT = TURN_T;
      if (player.y === 0) {
        for (let i = 0; i < 7; i++) {
          particles.push({
            x: player.x - player.facing * (4 + Math.random() * 10), y: player.z - 2 - Math.random() * 4,
            vx: -player.facing * (40 + Math.random() * 70), vy: -30 - Math.random() * 50,
            life: 0.22 + Math.random() * 0.18, maxLife: 0.4, size: 2.2 + Math.random() * 2.4,
            color: 'rgba(226, 184, 120, 0.85)'
          });
        }
      }
    }
    if (player.turnT > 0) player.turnT -= dt;
    if (player.landT > 0) player.landT -= dt;
    if (player.takeT > 0) player.takeT -= dt;

    // Jump physics
    if (player.y > 0 || player.vy !== 0) {
      player.y += player.vy * dt;
      player.vy -= 1450 * dt;
      if (player.y <= 0) {
        player.y = 0; player.vy = 0;
        player.landT = LAND_T;
        spawnParticles(player.x, player.z, 5, '#d49655', 85, 3);
        for (let k = -2; k <= 2; k++) if (k) spawnPuff(player.x + k * 9, player.z, 6, k * 34, 0.5, 0.45);
      }
    }
    if (player.y === 0 && player.vy === 0) { player.groundT = worldTime; player.jumped = false; }

    // Clamp player to lane & camera arena
    player.z = Math.max(LANE_TOP, Math.min(LANE_BOT, player.z));
    const minX = camX + 34;
    const maxX = zoneLocked ? camX + W - 34 : WORLD_LEN - 40;
    const preX = player.x;
    player.x = Math.max(minX, Math.min(maxX, player.x));
    if (player.hitOff) {
      // the v4-path hit origin hits the same walls the hero does; never let it drift far from the body
      const gx = Math.max(minX, Math.min(maxX, preX - player.hitOff));
      player.hitOff = Math.max(-40, Math.min(40, player.x - gx));
    }

    // Cape cloth trail
    player.cape[0].x = player.x - player.facing * 12;
    player.cape[0].y = player.z - player.y - 54;
    for (let i = 1; i < player.cape.length; i++) {
      const prev = player.cape[i - 1], cur = player.cape[i];
      cur.x += ((prev.x - player.facing * 9) - cur.x) * Math.min(1, dt * 16);
      cur.y += ((prev.y + 7 + Math.sin(worldTime * 8 + i) * 2.5) - cur.y) * Math.min(1, dt * 16);
    }

    for (let i = player.afterimages.length - 1; i >= 0; i--) {
      player.afterimages[i].life -= dt;
      if (player.afterimages[i].life <= 0) player.afterimages.splice(i, 1);
    }

    // Camera & Zone Progression
    if (!zoneLocked) {
      camLook += (player.facing * LOOK_AHEAD - camLook) * Math.min(1, dt * 3.5);
      const targetCam = Math.max(camX, Math.min(WORLD_LEN - W, player.x - W * 0.36 + camLook));
      camX += (targetCam - camX) * Math.min(1, dt * 7);

      if (zoneIdx < ZONES.length && camX >= lockXOf(zoneIdx) - 40) {
        zoneLocked = true;   // camera keeps easing the last few px (no snap / sudden stop)
        waveIdx = 0;
        goArrowTimer = 0;
        if (!ZONES[zoneIdx].boss) showBanner(ZONES[zoneIdx].name, 2.0);
        spawnWave();
      }
    } else {
      const lockX = lockXOf(zoneIdx);
      if (camX !== lockX) {
        const step = (lockX - camX) * Math.min(1, dt * 5);
        camX = Math.abs(lockX - camX) < 0.05 ? lockX : camX + step;
      }
      const alive = enemies.some(e => e.state !== 'dead');
      if (!alive) {
        waveIdx++;
        if (waveIdx < ZONES[zoneIdx].waves.length) {
          spawnWave();
        } else {
          zoneLocked = false;
          zoneIdx++;
          if (zoneIdx >= ZONES.length) {
            gameState = 'victory';
            return;
          } else {
            goArrowTimer = 4.5;
            showBanner('AREA CLEAR — ADVANCE!', 2.0);
          }
        }
      }
    }
    if (goArrowTimer > 0) goArrowTimer -= dt;

    // Pickups
    for (let i = pickups.length - 1; i >= 0; i--) {
      const pk = pickups[i];
      pk.bob += dt * 5;
      if (Math.abs(pk.x - player.x) < 42 && Math.abs(pk.z - player.z) < 34) {
        AudioFX.heal();
        if (pk.type === 'meat') {
          const st = getActiveHp();
          st.hp = Math.min(st.maxHp, st.hp + 38);
          addFloatText(pk.x, pk.z - 40, '+38 HP', '#5ef27c', 19);
        } else {
          player.rage = Math.min(100, player.rage + 40);
          addFloatText(pk.x, pk.z - 40, '+40 FURY', '#ffd042', 19);
        }
        pickups.splice(i, 1);
      }
    }

    // Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const pr = projectiles[i];
      pr.x += pr.vx * dt;
      pr.life -= dt;
      if (pr.fromPlayer) {
        for (const e of enemies) {
          if (e.state === 'dead' || pr.hitSet.has(e.id)) continue;
          if (Math.abs(e.x - pr.x) < 38 && Math.abs(e.z - pr.z) < 38) {
            pr.hitSet.add(e.id);
            damageEnemy(e, pr.dmg, pr.heavy, Math.sign(pr.vx) * 165, pr.heavy ? 'heavy' : 'light');
          }
        }
      } else {
        if (Math.abs(player.x - pr.x) < 32 && Math.abs(player.z - pr.z) < 32 && player.y < 42) {
          damagePlayer(pr.dmg, Math.sign(pr.vx) * 40);
          pr.life = 0;
        }
      }
      if (pr.life <= 0) projectiles.splice(i, 1);
    }

    // Enemies AI
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.hurtFlash > 0) e.hurtFlash -= dt;

      if (e.state === 'dead') {
        e.timer -= dt;
        if (e.timer <= 0) enemies.splice(i, 1);
        continue;
      }

      // Knockback / airborne physics
      if (e.kbDist) {
        e.kbT = Math.min(KB_DUR, e.kbT + dt);
        const k = e.kbT / KB_DUR, p = 1 - Math.pow(1 - k, KB_POW);   // ease-out
        const step = e.kbDist * (p - e.kbP);
        e.kbP = p;
        e.x += step;
        e.vx = step / Math.max(1e-4, dt);
        if (k >= 1) { e.kbDist = 0; e.vx = 0; }
      }
      if (e.y > 0 || e.vy !== 0) {
        e.y += e.vy * dt;
        e.vy -= 1300 * dt;
        if (e.y <= 0) { if (e.vy < -60) { spawnPuff(e.x - 10, e.z, 7, -40, 0.5, 0.45); spawnPuff(e.x + 10, e.z, 7, 40, 0.5, 0.45); } e.y = 0; e.vy = 0; }
      }

      const dx = player.x - e.x;
      const dz = player.z - e.z;
      const absDx = Math.abs(dx), absDz = Math.abs(dz);

      if (e.state === 'hurt') {
        e.timer -= dt;
        if (e.timer <= 0) e.state = 'approach';
      } else if (e.state === 'windup') {
        e.timer -= dt;
        if (e.timer <= 0) {
          e.state = 'attack';
          e.timer = 0.24;
          e.hasHit = false;
          AudioFX.swing(e.isBoss);
          if (e.isBoss && e.phase === 2) {
            // Fire wave along the lane
            projectiles.push({
              fromPlayer: false, x: e.x + e.facing * 50, z: e.z,
              vx: e.facing * 330, dmg: 16, life: 1.4, color: '#ff4814'
            });
          }
        }
      } else if (e.state === 'attack') {
        e.timer -= dt;
        if (!e.hasHit && e.timer < 0.17) {
          const hitDx = (player.x - e.x) * e.facing;
          if (hitDx >= -16 && hitDx <= e.reach && Math.abs(player.z - e.z) < 38 && player.y < 48) {
            e.hasHit = true;
            damagePlayer(e.dmg, e.facing * 45);
          }
        }
        if (e.timer <= 0) {
          e.state = 'recover';
          e.timer = e.isBoss ? (e.phase === 2 ? 0.5 : 0.8) : 0.65;
        }
      } else if (e.state === 'recover') {
        e.timer -= dt;
        if (e.timer <= 0) e.state = 'approach';
      } else {
        e.facing = dx >= 0 ? 1 : -1;
        e.animT += dt * 7;

        const targetDist = e.reach * 0.78;
        if (absDx > targetDist || absDz > 24) {
          const mx = absDx > targetDist ? Math.sign(dx) : 0;
          const mz = absDz > 18 ? Math.sign(dz) : 0;
          let entryBoost = 1;
          if (zoneLocked && !e.entered) {
            const out = e.x < camX ? camX - e.x : e.x - (camX + W);
            entryBoost = 1 + 0.7 * Math.max(0, Math.min(1, out / 160));

          e.specialCd -= dt;
          if (e.specialCd <= 0) {
            e.specialCd = e.phase === 2 ? 3.2 : 4.6;
            e.state = 'windup';
            e.timer = 0.55;
            spawnParticles(e.x, e.z - 60, 18, '#ff731a', 210, 5);

      e.z = Math.max(LANE_TOP, Math.min(LANE_BOT, e.z));

    for (let i = slashArcs.length - 1; i >= 0; i--) {
      slashArcs[i].life -= dt;
      if (slashArcs[i].life <= 0) slashArcs.splice(i, 1);

    for (let i = floatTexts.length - 1; i >= 0; i--) {
      const f = floatTexts[i];
      f.y += f.vy * dt; f.life -= dt;
      if (f.life <= 0) floatTexts.splice(i, 1);
    }
  }

  // far vista geometry: uniform scale (never stretched), wide enough for the whole camera range at FAR_PAR
  function farGeom() {

  function drawBackground() {

  // ---------------------------------------------------------------------------
  // Perspective floor. bg_floor.jpg is an ashlar wall texture (carved frieze on top). The frieze is cropped
  // away and only brick rows from the lower 2/3 are used. Each strip of the floor takes one brick row and
  // draws it with a height that grows geometrically from the horizon to the viewer, and a width scale that
  // follows, so the paving recedes. Everything is baked into one offscreen canvas; per frame each strip is a
  // single scrolled blit (scroll speed stays exactly 1:1 with the camera, so feet never slip on the ground).
  // ---------------------------------------------------------------------------
  const FLOOR = { key: '', cv: null, f: 1, P: 0, top: 0 };
  // bg_ground.jpg is painted ground with the perspective already baked in (thin far rows, tall near rows,
  // hazy at the horizon, darker near the viewer). It is scaled ONCE per layout, at one uniform scale that
  // fits the floor band (no squash), into an offscreen strip at device resolution that holds one full
  // loop plus a screen width, with seeded sand drifts painted on top. Per frame: one unscaled blit,
  // scrolled exactly 1:1 with the camera. The loop is ~2000 logical px, wider than a zone's visible span.
  function buildFloor() {
    const img = IMG.ground;
    if (!img || !img.naturalWidth) return false;
    const top = LANE_TOP - 10, band = H - top;
    let f = canvas.width / W;
    const key = W + 'x' + H + ':' + LANE_TOP + ':' + f;
    if (FLOOR.key === key && FLOOR.cv) return true;
    PERF_SKIP = true;
    const k = band / img.naturalHeight, P = img.naturalWidth * k;
    const cw0 = P + W + 2;
    f = Math.min(f, Math.sqrt(7e6 / (cw0 * band)));          // memory guard (~7 Mpx)
    const cv = makeCanvas(Math.ceil(cw0 * f), Math.ceil(band * f)), c = cv.getContext('2d');
    c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high';
    c.setTransform(f, 0, 0, f, 0, 0);
    for (let x = 0; x < cw0; x += P) c.drawImage(img, x, 0, P + 0.75, band);
    if (BAKED.sand) {   // seeded sand drifts, placed in loop space and wrapped so the strip stays seamless
      let seed = 8128; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
      const n = Math.round(P / 260);
      for (let i = 0; i < n; i++) {
        const d = 0.15 + rnd() * 0.8, r1 = rnd();
        const y = band * (0.08 + d * 0.86), sw = 120 + 260 * d * (0.6 + r1), sh = sw * (0.10 + 0.12 * d);
        const x = rnd() * P;

      }
      c.globalAlpha = 1;
    }

    return true;
  }

    if (!buildFloor()) return false;

    const sx = Math.round((((camX % P) + P) % P) * f);
    ctx.drawImage(FLOOR.cv, sx, 0, Math.round(W * f), FLOOR.cv.height, 0, FLOOR.top, W, band);
    return true;

  // contact + down-right cast shadows of the colonnade on the floor's far edge

  function bakeLateArt() {
    if (BAKED.ready || !IMG.pillar || !IMG.brazier) return;
    const pil = IMG.pillar;
    BAKED.pAspect = pil.naturalWidth / pil.naturalHeight;
    BAKED.bAspect = IMG.brazier.naturalWidth / IMG.brazier.naturalHeight;
    // far colonnade: fully opaque, same painted pillar as the mid-ground, lit with warm right-hand
    // sun and a shadow side, then tinted toward the haze colour (no transparency — that was the ghost look).
    const fh = 150, fw = fh * BAKED.pAspect, sc = 2;

  // Ambient dust drifting just above the floor
  const dust = [];
  function initDust() {
    dust.length = 0;

  // v4/v5/v6 drew solid-black pillar stumps and jagged rock silhouettes along the bottom edge.
  // They overlapped the floor, the fighters' feet and the touch controls, so they are gone.

  // =========================================================================
  // v9 LIVING WORLD: ambient motion. Visual only; nothing here reads input or writes gameplay state.
  // Every system is a fixed, pre-allocated pool (no per-frame allocation) with a hard cap.
  // Wind blows right -> left: the same way the clouds drift and the vortex's lower arm turns.
  // =========================================================================
  const WIND_DIR = -1;
  const AMB = {
    gust: 0, gustT: 5, gustAge: 0, gustOn: false, lastCam: 0,
    sand: [], puffs: [], grains: [], rings: [],
    devil: { on: false, fx: 0, age: 0, next: 6 },
    trickle: { next: 2.0, t: 0, mx: 0, y: 0, acc: 0 },
    vortex: { key: '', src: null, rot: null, frame: 0 },
    shim: null, shimCtx: null, clouds: null, banner: null, devilTex: null, puffTex: null,
    car0: 800, lone0: 760
  };
  const BIRDS = [
    { cx: 330, cy: 160, rx: 46, ry: 13, w: 0.34, ph: 0.0, s: 9 },
    { cx: 470, cy: 132, rx: 32, ry: 10, w: -0.42, ph: 2.1, s: 7 },
    { cx: 760, cy: 172, rx: 54, ry: 15, w: 0.29, ph: 4.0, s: 8 },
    { cx: 1060, cy: 140, rx: 28, ry: 9, w: -0.5, ph: 1.2, s: 6 }
  ];
  const CLOUDS = [
    { x0: 140, v: 9, y: 0.20, w: 300, a: 0.55, k: 0 },
    { x0: 560, v: 6, y: 0.56, w: 380, a: 0.42, k: 1 },
    { x0: 980, v: 12, y: 0.36, w: 240, a: 0.50, k: 2 },
    { x0: 1380, v: 7.5, y: 0.72, w: 420, a: 0.38, k: 1 }
  ];
  function windSpeed() { return WIND_DIR * (34 + 80 * AMB.gust); }
  function seeded(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

  function bakeAmbient() {
    // drifting cloud wisps: dark smoke bodies, sunlit on the upper-left
    AMB.clouds = [];
    for (let k = 0; k < 3; k++) {
      const w = 360, h = 96, cv = makeCanvas(w, h), c = cv.getContext('2d'), r = seeded(77 + k * 131);
      for (let i = 0; i < 28; i++) {
        const t = i / 27, env = Math.sin(Math.PI * t);
        const x = w * (0.07 + 0.86 * t) + (r() - 0.5) * w * 0.05;
        const y = h * (0.56 + (r() - 0.5) * 0.22), rad = h * (0.14 + 0.30 * env * (0.6 + 0.4 * r()));
        let g = c.createRadialGradient(x, y, 0, x, y, rad);
        g.addColorStop(0, 'rgba(104, 32, 12, 0.30)'); g.addColorStop(1, 'rgba(104, 32, 12, 0)');
        c.fillStyle = g; c.fillRect(x - rad, y - rad, rad * 2, rad * 2);
        const hx = x - rad * 0.3, hy = y - rad * 0.38, hr = rad * 0.7;
        g = c.createRadialGradient(hx, hy, 0, hx, hy, hr);
        g.addColorStop(0, 'rgba(255, 198, 114, 0.22)'); g.addColorStop(1, 'rgba(255, 198, 114, 0)');
        c.fillStyle = g; c.fillRect(hx - hr, hy - hr, hr * 2, hr * 2);
      }
      AMB.clouds.push(cv);
    }
    // banner cloth: burnt red with gold trim and a sun disk, lit from the upper-left
    {
      const w = 56, h = 200, cv = makeCanvas(w, h), c = cv.getContext('2d');
      c.beginPath(); c.moveTo(0, 0); c.lineTo(w, 0); c.lineTo(w, h); c.lineTo(w / 2, h - 28); c.lineTo(0, h); c.closePath(); c.clip();
      let g = c.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, '#bb4a1e'); g.addColorStop(0.45, '#8c2e12'); g.addColorStop(1, '#4a1509');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      for (let i = 0; i < 4; i++) {          // soft vertical folds
        const x = 9 + i * 12.5;
        g = c.createLinearGradient(x - 6, 0, x + 6, 0);
        g.addColorStop(0, 'rgba(255, 190, 120, 0.12)'); g.addColorStop(0.5, 'rgba(255, 190, 120, 0)'); g.addColorStop(1, 'rgba(30, 8, 2, 0.22)');
        c.fillStyle = g; c.fillRect(x - 6, 0, 12, h);
      }
      c.fillStyle = '#d9a040'; c.fillRect(3, 0, 3, h); c.fillRect(w - 6, 0, 3, h);
      c.fillStyle = '#f0c060'; c.fillRect(3, 0, 1, h);
      c.fillStyle = '#e4ac48'; c.beginPath(); c.arc(w / 2, 66, 11, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#e4ac48'; c.lineWidth = 2;
      for (let a = 0; a < 12; a++) { const an = a * Math.PI / 6; c.beginPath(); c.moveTo(w / 2 + Math.cos(an) * 14, 66 + Math.sin(an) * 14); c.lineTo(w / 2 + Math.cos(an) * 19, 66 + Math.sin(an) * 19); c.stroke(); }
      c.fillStyle = 'rgba(255, 236, 170, 0.6)'; c.beginPath(); c.arc(w / 2 - 4, 62, 4, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#d9a040'; c.fillRect(0, 112, w, 3); c.fillRect(0, 120, w, 2);
      g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, 'rgba(255, 200, 120, 0.12)'); g.addColorStop(0.5, 'rgba(0, 0, 0, 0)'); g.addColorStop(1, 'rgba(26, 7, 2, 0.38)');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      c.fillStyle = 'rgba(20, 6, 2, 0.5)'; c.fillRect(0, 0, w, 7);
      AMB.banner = cv;
    }
    // dust devil funnel: sand dabs, light side left
    {
      const w = 90, h = 200, cv = makeCanvas(w, h), c = cv.getContext('2d'), r = seeded(4242);
      for (let i = 0; i < 900; i++) {
        const f = r(), half = w * 0.5 * (0.10 + 0.90 * Math.pow(1 - f, 1.5));
        const u = r() * 2 - 1, x = w / 2 + u * half * 0.92, y = f * h;
        const rad = 1.5 + 4.5 * (1 - f * 0.7) * r();
        c.fillStyle = u < -0.1 ? `rgba(250, 214, 156, ${0.16 + 0.18 * r()})` : `rgba(150, 88, 44, ${0.16 + 0.18 * r()})`;
        c.beginPath(); c.arc(x, y, rad, 0, Math.PI * 2); c.fill();
      }
      AMB.devilTex = cv;
    }
    // dust puff
    {
      const cv = makeCanvas(64, 64), c = cv.getContext('2d');
      const g = c.createRadialGradient(28, 28, 2, 32, 32, 32);
      g.addColorStop(0, 'rgba(238, 198, 138, 0.95)'); g.addColorStop(0.5, 'rgba(222, 176, 116, 0.5)'); g.addColorStop(1, 'rgba(210, 160, 100, 0)');
      c.fillStyle = g; c.fillRect(0, 0, 64, 64);
      AMB.puffTex = cv;
    }
    AMB.shim = document.createElement('canvas');
  }

  function initAmbient() {
    const A = AMB;
    A.sand.length = 0; A.puffs.length = 0; A.grains.length = 0; A.rings.length = 0;
    for (let i = 0; i < 64; i++) A.sand.push({ x: Math.random() * (W + 60) - 30, d: Math.random(), sp: 0.6 + Math.random() * 0.8, len: 3 + Math.random() * 6, a: 0.16 + Math.random() * 0.30, ph: Math.random() * 6.28, fg: i < 10 });
    for (const p of A.sand) if (p.fg) p.d = 0.3 + Math.random() * 0.45;
    for (let i = 0; i < 48; i++) A.puffs.push({ on: false, x: 0, z: 0, r: 0, vr: 0, vx: 0, life: 0, max: 1, a: 0 });
    for (let i = 0; i < 72; i++) A.grains.push({ on: false, mx: 0, y: 0, vx: 0, vy: 0 });
    for (let i = 0; i < 6; i++) A.rings.push({ on: false, x: 0, z: 0, t: 0, max: 0.55, s: 1 });
    A.lastCam = camX;
  }
  function spawnPuff(x, z, r, vx, life, a, vr) {
    const P = AMB.puffs;
    for (let i = 0; i < P.length; i++) {
      const p = P[i];
      if (!p.on) { p.on = true; p.x = x; p.z = z; p.r = r; p.vx = vx; p.life = p.max = life; p.a = a; p.vr = vr == null ? r * 1.6 : vr; return; }
    }
  }
  function spawnShock(x, z, s) {
    const R = AMB.rings;
    for (let i = 0; i < R.length; i++) if (!R[i].on) { const q = R[i]; q.on = true; q.x = x; q.z = z; q.t = 0; q.max = 0.55; q.s = s; break; }
    for (let k = 0; k < 9; k++) {
      const a = (k / 9) * Math.PI * 2;
      spawnPuff(x + Math.cos(a) * 12 * s, z + Math.sin(a) * 3 * s, 8 * s, Math.cos(a) * 130 * s, 0.65, 0.6, 18 * s);
    }
  }
  function spawnGrain(mx, y) {
    const G = AMB.grains;
    for (let i = 0; i < G.length; i++) { const g = G[i]; if (!g.on) { g.on = true; g.mx = mx; g.y = y; g.vx = (Math.random() - 0.5) * 6; g.vy = 10 + Math.random() * 20; return; } }
  }

  function updateAmbient(dt) {
    const A = AMB;
    // gusts: every 6-13 s a 3.4 s swell
    if (!A.gustOn) { A.gustT -= dt; if (A.gustT <= 0) { A.gustOn = true; A.gustAge = 0; } }
    else {
      A.gustAge += dt; const u = A.gustAge / 3.4;
      A.gust = u >= 1 ? 0 : Math.pow(Math.sin(Math.PI * u), 2);
      if (u >= 1) { A.gustOn = false; A.gustT = 6 + Math.random() * 7; }
    }
    const ws = windSpeed();
    let dc = camX - A.lastCam; A.lastCam = camX;
    if (Math.abs(dc) > 200) dc = 0;
    for (let i = 0; i < A.sand.length; i++) {
      const p = A.sand[i];
      p.x += ws * p.sp * (0.55 + p.d * 0.9) * dt - dc * (0.5 + p.d * 0.6);
      if (p.x < -40) { p.x += W + 80; if (!p.fg) p.d = Math.random(); }
      else if (p.x > W + 40) p.x -= W + 80;
    }
    for (let i = 0; i < A.puffs.length; i++) {
      const p = A.puffs[i]; if (!p.on) continue;
      p.life -= dt; if (p.life <= 0) { p.on = false; continue; }
      p.r += p.vr * dt; p.x += p.vx * dt + ws * 0.12 * dt; p.vx *= Math.max(0, 1 - 3 * dt); p.vr *= Math.max(0, 1 - 1.6 * dt);
    }
    for (let i = 0; i < A.rings.length; i++) { const q = A.rings[i]; if (q.on && (q.t += dt) >= q.max) q.on = false; }
    for (let i = 0; i < A.grains.length; i++) {
      const g = A.grains[i]; if (!g.on) continue;
      g.vy += 300 * dt; g.mx += (g.vx + ws * 0.2) * dt; g.y += g.vy * dt;
      if (g.y > LANE_TOP - 12) g.on = false;
    }
    // sand trickling off a capital now and then
    const T = A.trickle;
    if (T.t > 0) {
      T.t -= dt; T.acc += dt * 36;
      while (T.acc >= 1) { T.acc -= 1; spawnGrain(T.mx + (Math.random() - 0.5) * 3, T.y); }
    } else if ((T.next -= dt) <= 0) {
      T.next = 2.5 + Math.random() * 3.5;
      if (PILL.n) {
        const i = Math.floor(Math.random() * PILL.n), cx = PILL.x[i], pw = PILL.w[i];
        if (cx > 60 && cx < W - 60) {
          T.mx = cx + (Math.random() < 0.5 ? -1 : 1) * pw * 0.40 + camX * 0.65;
          T.y = LANE_TOP + 12 - 262 + 12; T.t = 1.4 + Math.random() * 1.4; T.acc = 0;
        }
      }
    }
    // rare dust devil crossing the far background
    const D = A.devil;
    if (D.on) { D.age += dt; D.fx += WIND_DIR * 22 * (1 + A.gust * 0.6) * dt; if (D.fx - camX * FAR_PAR < -140) D.on = false; }
    else if ((D.next -= dt) <= 0) { D.on = true; D.age = 0; D.fx = camX * FAR_PAR + W + 90; D.next = 45 + Math.random() * 40; }
  }

  // --- sky ---
  function drawVortexSpin(skyImg, sc, sunX, ay, skyH, VX, VY) {
    const V = AMB.vortex, fx = canvas.width / W;
    const R = Math.round(Math.min(skyH * 0.7, W * 0.3));
    const D = Math.round(2 * R * fx);                    // device-res disk: blitted unscaled every frame
    const key = R + ':' + D + ':' + sc.toFixed(4);
    if (V.key !== key) {
      V.key = key; V.src = makeCanvas(D, D); V.rot = makeCanvas(D, D);
      const c = V.src.getContext('2d'), iw = skyImg.naturalWidth, ih = skyImg.naturalHeight, rs = R / sc;
      c.drawImage(skyImg, VX * iw - rs, VY * ih - rs, 2 * rs, 2 * rs, 0, 0, D, D);
      c.globalCompositeOperation = 'destination-in';
      const g = c.createRadialGradient(D / 2, D / 2, D * 0.16, D / 2, D / 2, D * 0.5);
      g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = g; c.fillRect(0, 0, D, D);
      V.frame = 0; PERF_SKIP = true;
    }
    // re-rotated at 15 Hz into a feathered disk (0.002 rad per step: the steps are sub-pixel)
    if ((V.frame++ % 4) === 0) {
      const c = V.rot.getContext('2d');
      c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, D, D);
      c.translate(D / 2, D / 2); c.rotate(worldTime * 0.032); c.drawImage(V.src, -D / 2, -D / 2);
    }
    ctx.drawImage(V.rot, Math.round((sunX - R) * fx) / fx, Math.round((ay - R) * fx) / fx, D / fx, D / fx);
  }
  function drawClouds(skyH) {
    const C = AMB.clouds; if (!C) return;
    const span = W + 700, fx = canvas.width / W, fy = canvas.height / H;
    if (!AMB.cloudInst || AMB.cloudKey !== fx + ':' + fy) {          // v9 perf: one device-res bake per instance
      AMB.cloudKey = fx + ':' + fy; AMB.cloudInst = [];
      for (let k = 0; k < CLOUDS.length; k++) {
        const c = CLOUDS[k], T = C[c.k], h = c.w * T.height / T.width;
        const cv = makeCanvas(Math.round(c.w * fx), Math.round(h * fy)), g = cv.getContext('2d');
        g.globalAlpha = c.a; g.drawImage(T, 0, 0, cv.width, cv.height);
        AMB.cloudInst.push(cv);
      }
    }
    for (let k = 0; k < CLOUDS.length; k++) {
      const c = CLOUDS[k], I = AMB.cloudInst[k], h = I.height / fy;
      const x = ((c.x0 + WIND_DIR * worldTime * c.v - camX * 0.1) % span + span) % span - 350;
      if (x > W || x + c.w < 0) continue;
      ctx.drawImage(I, Math.round(x * fx) / fx, Math.round((skyH * c.y - h / 2) * fy) / fy, I.width / fx, h);
    }
  }


  // --- far layer: vultures, caravan, lone figure, dust devil (all drawn before the haze) ---
  function drawCamel(x, y, s, ph, rider) {
    ctx.save(); ctx.translate(x, y); ctx.scale(-1, 1);           // walking left
    ctx.lineWidth = s * 0.13;
    for (const k of [-0.45, -0.25, 0.35, 0.55]) {
      const sw = Math.sin(ph + k * 5) * 0.2 * s;
      ctx.beginPath(); ctx.moveTo(k * s, -1.0 * s); ctx.lineTo(k * s + sw, 0); ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(0, -1.15 * s, 0.72 * s, 0.30 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-0.1 * s, -1.42 * s, 0.32 * s, 0.22 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = s * 0.19;
    ctx.beginPath(); ctx.moveTo(0.55 * s, -1.2 * s); ctx.quadraticCurveTo(0.95 * s, -1.25 * s, 0.98 * s, -1.72 * s); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(1.07 * s, -1.74 * s, 0.2 * s, 0.1 * s, 0, 0, Math.PI * 2); ctx.fill();
    if (rider) {
      ctx.lineWidth = s * 0.2;
      ctx.beginPath(); ctx.moveTo(-0.1 * s, -1.6 * s); ctx.lineTo(-0.05 * s, -2.15 * s); ctx.stroke();
      ctx.beginPath(); ctx.arc(-0.04 * s, -2.32 * s, 0.15 * s, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  function drawWalker(x, y, s, ph, dir) {
    ctx.lineWidth = s * 0.14;
    const sw = Math.sin(ph) * 0.22 * s;
    ctx.beginPath(); ctx.moveTo(x - sw, y); ctx.lineTo(x, y - 0.9 * s); ctx.lineTo(x + sw, y); ctx.stroke();
    ctx.lineWidth = s * 0.2;
    ctx.beginPath(); ctx.moveTo(x, y - 0.9 * s); ctx.lineTo(x + dir * 0.04 * s, y - 1.6 * s); ctx.stroke();
    ctx.beginPath(); ctx.arc(x + dir * 0.05 * s, y - 1.78 * s, 0.16 * s, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = s * 0.08;
    ctx.beginPath(); ctx.moveTo(x + dir * 0.35 * s, y); ctx.lineTo(x + dir * 0.28 * s, y - 2.0 * s); ctx.stroke();   // staff
  }
  function drawFarLife() {
    const t = worldTime, A = AMB;
    // vultures circling (hazy dark, small)
    ctx.strokeStyle = 'rgba(70, 28, 12, 0.78)'; ctx.lineCap = 'round';
    const span = W + 240;
    for (let k = 0; k < BIRDS.length; k++) {
      const B = BIRDS[k];
      const cx = ((B.cx - camX * 0.15) % span + span) % span - 120;
      const a = t * B.w + B.ph, s = B.s;
      const x = cx + Math.cos(a) * B.rx, y = LANE_TOP - B.cy + Math.sin(a) * B.ry;
      const fl = Math.sin(t * 0.45 + B.ph * 3) > 0.62 ? Math.sin(t * 8.5 + B.ph) : 0.22 + Math.sin(t * 1.3 + B.ph) * 0.08;
      ctx.lineWidth = Math.max(1.1, s * 0.22);
      ctx.beginPath();
      ctx.moveTo(x - s, y + s * 0.1 - fl * s * 0.45);
      ctx.quadraticCurveTo(x - s * 0.45, y - s * 0.3, x, y);
      ctx.quadraticCurveTo(x + s * 0.45, y - s * 0.3, x + s, y + s * 0.1 - fl * s * 0.45);
      ctx.stroke();
    }
    const hy = LANE_TOP - 13, s = Math.max(7, H * 0.019);
    ctx.fillStyle = 'rgba(84, 38, 18, 0.88)'; ctx.strokeStyle = 'rgba(84, 38, 18, 0.88)';
    // caravan crossing slowly right -> left
    const cyc = W + 1100;
    const cx = ((A.car0 - t * 6 - camX * FAR_PAR) % cyc + cyc) % cyc - 300;
    if (cx > -8 * s && cx < W + 4 * s) {
      const ph = t * 2.6;
      drawCamel(cx, hy, s, ph, true);
      drawCamel(cx + 2.5 * s, hy, s * 0.95, ph + 1.3, false);
      drawCamel(cx + 5.0 * s, hy, s * 0.9, ph + 2.4, true);
      drawWalker(cx + 7.1 * s, hy, s * 0.95, ph * 1.4, -1);
    }
    // lone figure walking the other way
    const lyc = W + 1500;
    const lx = ((A.lone0 + t * 4.5 - camX * FAR_PAR) % lyc + lyc) % lyc - 600;
    if (lx > -20 && lx < W + 20) drawWalker(lx, hy, s * 0.9, t * 3.4, 1);
    // dust devil
    const D = A.devil;
    if (D.on && A.devilTex) {
      const x = D.fx - camX * FAR_PAR, h = H * 0.2, w = h * 0.72, T = A.devilTex, N = 12;
      const fade = Math.min(1, D.age / 2.5) * Math.max(0, Math.min(1, (x + 140) / 220));
      ctx.globalAlpha = 0.42 * fade;
      ctx.drawImage(A.puffTex, x - w * 0.9, hy - 9, w * 1.8, 14);
      ctx.globalAlpha = 0.85 * fade;
      for (let j = 0; j < N; j++) {
        const f = j / N;
        const off = Math.sin(t * 4.4 + f * 7) * 3.2 * (1 - f * 0.5) + WIND_DIR * (1 - f) * 9 * (0.6 + A.gust);
        ctx.drawImage(T, 0, f * T.height, T.width, T.height / N + 1, x - w / 2 + off, hy - h + f * h, w, h / N + 0.8);
      }
      ctx.globalAlpha = 1;
    }
  }

  // --- midground: banners, trickling sand, heat shimmer, brazier light pools ---
  function drawBanner(cx, top, w, h, seed) {
    const T = AMB.banner; if (!T) return;
    const N = 9, t = worldTime, g = AMB.gust;
    for (let j = 0; j < N; j++) {
      const f0 = j / N, f = (j + 0.5) / N;
      const sway = Math.pow(f, 1.3) * (Math.sin(t * 2.2 + f * 3.4 + seed * 1.7) * (2.2 + 2.8 * g)
                 + Math.sin(t * 5.1 + f * 6 + seed) * 0.8 * (0.4 + g) + WIND_DIR * (2 + 6 * g));
      ctx.drawImage(T, 0, f0 * T.height, T.width, T.height / N + 1, cx - w / 2 + sway, top + f0 * h, w, h / N + 0.7);
    }
    ctx.fillStyle = '#5e3212'; ctx.fillRect(cx - w * 0.62, top - 2.5, w * 1.24, 3.5);
    ctx.fillStyle = '#e6ae4c'; ctx.fillRect(cx - w * 0.62, top - 2.5, w * 1.24, 1);
  }
  function drawGrains() {
    ctx.fillStyle = 'rgb(234, 190, 124)';
    ctx.globalAlpha = 0.85;
    const G = AMB.grains;
    for (let i = 0; i < G.length; i++) { const g = G[i]; if (g.on) ctx.fillRect(g.mx - camX * 0.65, g.y, 1.3, 2.2); }
    ctx.globalAlpha = 1;
  }
  function drawHeatShimmer() {
    if (QUALITY.fxMul < 1 || shakeMag > 0.4 || !AMB.shim) return;
    const fx = canvas.width / W, fy = canvas.height / H;
    const y1 = LANE_TOP - 8, hy0 = y1 - 44, HB = 44, BB = 84, BW = 56;
    // v9 perf: snapshot only the rows/patches that actually wobble (horizon strip + one small patch per flame)
