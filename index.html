    ctx.drawImage(S, sx - rx * 1.05 * k + rx * 0.12, z + 3 - ry * 1.05 * k, rx * 2.1 * k, ry * 2.1 * k);
    ctx.globalAlpha = 0.30 * k;
    ctx.drawImage(S, sx - rx * 0.4, z + 1 - ry * 0.6, rx * 2.4, ry * 1.6);   // soft spread toward lower-right
    ctx.globalAlpha = 1;
  }

  function heroDrawHeight(heroId) {
    return heroId === 'thebeard' ? 132 : 124;
  }

  function easeOut(t) { return 1 - (1 - t) * (1 - t); }

  function drawHero(x, z, y, facing, heroId, state, animT, invuln, ghost) {
    const key = heroId === 'thebeard' ? 'thebeard' : 'mzcookie';
    const h = heroDrawHeight(heroId);
    if (!ghost) drawGroundShadow(x, z, heroId === 'thebeard' ? 32 : 26, heroId === 'thebeard' ? 10 : 9, y);

    let vis = null;
    if (!ghost) {
      player.visBy = player.visBy || {};
      vis = player.visBy[key] || (player.visBy[key] = newVis());
    }
    const attacking = state === 'light' || state === 'heavy' || state === 'ult';
    const walking = vis ? stepVis(vis, x, z, facing, h, key, state === 'walk' && !(y > 1), 2.4) : false;

    let spec;
    if (attacking) spec = { k: 'rest', name: key + '_attack' };
    else if (walking) spec = { k: 'walk', key, f: Math.floor(vis.phase * WALK_META[key].n) % WALK_META[key].n };
    else spec = { k: 'rest', name: key + '_idle' };

    // idle breathing (feet stay planted) + attack anticipation / follow-through
    let squash = 1, rot = 0;
    const idleNow = !attacking && !walking && state !== 'hurt' && state !== 'dodge' && !ghost && !(y > 0);
    if (attacking && !ghost) {
      const prog = 1 - player.stateTimer / Math.max(0.01, player.stateDur);
      if (prog < 0.22) { const k = prog / 0.22; rot = -0.07 * k; squash = 1 - 0.035 * k; }
      else if (prog < 0.5) { const k = (prog - 0.22) / 0.28; rot = -0.07 + 0.16 * easeOut(k); squash = 0.965 + 0.065 * easeOut(k); }
      else { const k = Math.min(1, (prog - 0.5) / 0.5); rot = 0.09 * (1 - k); squash = 1.03 - 0.03 * k; }
    } else if (state === 'dodge') { rot = 0.14; squash = 0.97; }
    else if (state === 'hurt') rot = -0.1;

    let sx = 1;
    if (!ghost) {
      if (player.turnT > 0) { const k = player.turnT / TURN_T; sx *= 1 - 0.38 * k; rot -= 0.13 * k; }      // skid: narrow + lean back
      if (player.landT > 0) { const k = player.landT / LAND_T; squash *= 1 - 0.14 * k; sx *= 1 + 0.10 * k; }  // landing squash
      if (player.takeT > 0) { const k = player.takeT / TAKEOFF_T; squash *= 1 + 0.11 * k; sx *= 1 - 0.07 * k; } // takeoff stretch
    }

    const ok = drawActorSpec(vis, spec, x, z, y || 0, facing, h, {
      squashY: squash, sx, rot, invuln: invuln > 0, flash: state === 'hurt', cast: !ghost,
      idle: idleNow ? idleParams(key === 'thebeard' ? 1.7 : 0.3, key === 'mzcookie', facing) : null
    });
    if (!ok) drawHeroFallback(x, z, y, facing, heroId, state, animT, invuln);
  }

  function drawEnemy(e) {
    const sx = e.x - camX;
    const sc = e.scale || 1;
    drawGroundShadow(e.x, e.z, 24 * sc, 8.5 * sc, e.y);

    const key = e.isBoss ? 'boss' : (e.type === 'shield' ? 'shield' : e.type === 'zealot' ? 'zealot' : 'marauder');
    const baseH = e.isBoss ? 118 : 112;
    const drawH = baseH * sc;
    const vis = e.vis || (e.vis = newVis());
    const dead = e.state === 'dead';
    const canWalk = e.state === 'approach' && !(e.y > 1) && Math.abs(e.vx) < 30;
    const walking = dead ? false : stepVis(vis, e.x, e.z, e.facing, drawH, key, canWalk, e.isBoss ? 4.4 : 2.4);
    const spec = walking
      ? { k: 'walk', key, f: Math.floor(vis.phase * WALK_META[key].n) % WALK_META[key].n }
      : { k: 'rest', name: key };

    // smooth lean: wind-up anticipation back, strike forward, hurt recoil, death fall
    let target = 0;
    if (e.state === 'windup') target = -0.14;
    else if (e.state === 'attack') target = 0.18;
    else if (e.hurtFlash > 0) target = -0.09;
    vis.lean += (target - vis.lean) * Math.min(1, frameDt * 16);
    let rot = vis.lean, alpha = 1, yOff = 0, squash = 1;
    const eIdle = !walking && !dead && e.state !== 'windup' && e.state !== 'attack' && !(e.hurtFlash > 0) && !(e.y > 1);
    if (dead) {
      const t = Math.min(1, Math.max(0, 1 - e.timer / 0.55));
      rot = -1.25 * easeOut(Math.min(1, t * 1.6));
      alpha = t < 0.55 ? 1 : Math.max(0, 1 - (t - 0.55) / 0.45);
      yOff = -4 * t;
    }
    const ok = drawActorSpec(vis, spec, e.x, e.z, (e.y || 0) + yOff, e.facing, drawH, {
      rot, alpha, squashY: squash, flash: e.hurtFlash > 0, cast: true,
      idle: eIdle ? idleParams(e.id * 10, false, e.facing) : null
    });
    if (!ok) { drawEnemyFallback(e); return; }

    if (e.state === 'windup') {
      ctx.fillStyle = 'rgba(255, 70, 25, 0.92)';
      ctx.beginPath();
      ctx.arc(sx + e.facing * 8, e.z - e.y - drawH * 0.92, 7 + Math.sin(worldTime * 35) * 2, 0, Math.PI * 2);
      ctx.fill();
    }

    if (!e.isBoss && !dead && e.hp < e.maxHp) {
      const bw = 48;
      const by = e.z - e.y - drawH - 12;
      ctx.fillStyle = 'rgba(15, 6, 4, 0.82)';
      ctx.fillRect(sx - bw / 2, by, bw, 6);
      ctx.fillStyle = '#e83e1c';
      ctx.fillRect(sx - bw / 2 + 1, by + 1, (bw - 2) * Math.max(0, e.hp / e.maxHp), 4);
      ctx.strokeStyle = 'rgba(230, 180, 80, 0.55)';
      ctx.lineWidth = 1;
      ctx.strokeRect(sx - bw / 2, by, bw, 6);
    }
  }

  function drawUrn(u) {
    if (u.broken) {                                         // v12: the painted remains stay on the ground (no collision), item lies beside them
      const k = Math.min(1, (worldTime - (u.brokeT || 0)) / 0.18), sq = 1 - 0.22 * (1 - k) * (1 - k);
      drawGroundShadow(u.x - 20, u.z, 25, 7, 0);
      if (drawWorldSprite('prop_urnbroken', u.x - 20, u.z - 1, 0, 1, 43, { cast: true, squashY: sq })) return;
      return;
    }
    const sx = u.x - camX, sy = u.z;
    drawGroundShadow(u.x, u.z, 16, 6, 0);
    if (drawWorldSprite('urn', u.x, u.z, 0, 1, 52, { cast: true })) return;
    const ug = ctx.createLinearGradient(sx - 14, sy - 34, sx + 14, sy);
    ug.addColorStop(0, '#e09348'); ug.addColorStop(1, '#6b3214');
    ctx.fillStyle = ug;
    ctx.beginPath(); ctx.ellipse(sx, sy - 16, 13, 17, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c47632';
    ctx.fillRect(sx - 8, sy - 36, 16, 6);
    ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx - 12, sy - 16); ctx.lineTo(sx + 12, sy - 16); ctx.stroke();
  }

  function drawHeroFallback(x, z, y, facing, heroId, state, animT, invuln) {
    const sx = x - camX;
    const sy = z - y;
    const walkBob = state === 'walk' ? Math.abs(Math.sin(animT)) * 6 : Math.sin(worldTime * 3.5) * 1.6;
    const stride = state === 'walk' ? Math.sin(animT) * 13 : 0;
    const atkTilt = (state === 'light' || state === 'heavy') ? 0.24 : 0;

    // Ground shadow
    ctx.fillStyle = 'rgba(20, 7, 3, 0.48)';
    ctx.beginPath();
    ctx.ellipse(sx, z + 3, heroId === 'thebeard' ? 30 : 24, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    if (invuln > 0 && Math.floor(worldTime * 22) % 2 === 0) ctx.globalAlpha = 0.55;

    // Flowing Cape for MzCookie (world-space ribbon)
    if (heroId === 'mzcookie') {
      ctx.fillStyle = '#181316';
      ctx.strokeStyle = '#d4a138';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(player.cape[0].x - camX, player.cape[0].y);
      for (let i = 1; i < player.cape.length; i++) {
        ctx.lineTo(player.cape[i].x - camX - facing * i * 2, player.cape[i].y + i * 2);
      }
      for (let i = player.cape.length - 1; i >= 0; i--) {
        ctx.lineTo(player.cape[i].x - camX + facing * 10, player.cape[i].y + 22);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    ctx.translate(sx, sy - walkBob);
    ctx.scale(facing, 1);
    ctx.rotate(atkTilt);

    if (heroId === 'mzcookie') {
      // --- MZCOOKIE: Royal Desert Queen ---
      // Legs / boots
      ctx.strokeStyle = '#241a18'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-5, -24); ctx.lineTo(-7 - stride, -2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(6, -24); ctx.lineTo(8 + stride, -2); ctx.stroke();
      // Gold shin trim
      ctx.strokeStyle = '#e5b244'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(7 + stride * 0.7, -11); ctx.lineTo(8 + stride, -2); ctx.stroke();

      // Black & gold Egyptian warrior dress
      const dg = ctx.createLinearGradient(-16, -58, 16, -12);
      dg.addColorStop(0, '#2a2224'); dg.addColorStop(1, '#110d0f');
      ctx.fillStyle = dg;
      ctx.beginPath();
      ctx.moveTo(-11, -56); ctx.lineTo(12, -56);
      ctx.lineTo(18, -14); ctx.lineTo(-17, -14);
      ctx.closePath(); ctx.fill();

      // Gold belt & vertical dress trim
      ctx.fillStyle = '#e8b647';
      ctx.fillRect(-13, -36, 26, 5);
      ctx.fillRect(-3, -34, 6, 20);

      // Ornate Egyptian Broad Collar (Usekh)
      ctx.fillStyle = '#f2c14e';
      ctx.beginPath();
      ctx.ellipse(0, -56, 15, 7, 0, 0, Math.PI);
      ctx.fill();
      ctx.strokeStyle = '#2e1e10'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.ellipse(0, -56, 11, 5, 0, 0, Math.PI); ctx.stroke();

      // Layered Dark Curly Hair (back mass)
      ctx.fillStyle = '#140c0a';
      for (let i = 0; i < 7; i++) {
        ctx.beginPath();
        ctx.arc(-9 - (i % 3) * 4, -74 + i * 4.2, 7.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // Head & warm skin rim-lighting
      ctx.fillStyle = '#8b5134';
      ctx.beginPath(); ctx.arc(1, -72, 10.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffbf66'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(1, -72, 10.5, -0.7, 0.8); ctx.stroke();
      // Gold hoop earring
      ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(-4, -67, 3.2, 0, Math.PI * 2); ctx.stroke();
      // Top curls
      ctx.fillStyle = '#1a100d';
      ctx.beginPath(); ctx.arc(-2, -80, 8, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(6, -79, 5.5, 0, Math.PI * 2); ctx.fill();

      // Attacking Arm + Golden Solar Khopesh
      const swingAng = (state === 'light' || state === 'heavy') ? -0.9 + (1 - player.stateTimer / Math.max(0.01, player.stateDur)) * 2.1 : 0.25;
      ctx.save();
      ctx.translate(6, -52);
      ctx.rotate(swingAng);
      ctx.strokeStyle = '#8b5134'; ctx.lineWidth = 5.5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(18, 4); ctx.stroke();
      // Gilded wrist cuff
      ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 6.5;
      ctx.beginPath(); ctx.moveTo(11, 2.5); ctx.lineTo(17, 3.8); ctx.stroke();
      // Solar Energy Khopesh Blade
      ctx.strokeStyle = '#ffe580'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(18, 4); ctx.lineTo(34, -2);
      ctx.quadraticCurveTo(48, -10, 44, -24);
      ctx.stroke();
      ctx.restore();

    } else {
      // --- THE BEARD: Fur-Armored Iron Vanguard ---
      // Heavy armored legs
      ctx.strokeStyle = '#33251b'; ctx.lineWidth = 9.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-8, -26); ctx.lineTo(-10 - stride, -2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(8, -26); ctx.lineTo(10 + stride, -2); ctx.stroke();
      ctx.strokeStyle = '#9c7138'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(9 + stride * 0.7, -14); ctx.lineTo(10 + stride, -2); ctx.stroke();

      // Broad Dark Bronze Plate Torso
      const ag = ctx.createLinearGradient(-18, -68, 18, -22);
      ag.addColorStop(0, '#5a3f28'); ag.addColorStop(0.6, '#362417'); ag.addColorStop(1, '#1f140d');
      ctx.fillStyle = ag;
      ctx.beginPath();
      ctx.moveTo(-17, -66); ctx.lineTo(19, -66);
      ctx.lineTo(15, -22); ctx.lineTo(-15, -22);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#c48f3e'; ctx.lineWidth = 2;
      ctx.stroke();

      // Fur Shoulder Mantle
      ctx.fillStyle = '#5c4128';
      ctx.beginPath();
      ctx.ellipse(-8, -64, 15, 9, -0.25, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8a6642'; ctx.lineWidth = 1.6;
      ctx.stroke();

      // Swept Hair & Head
      ctx.fillStyle = '#d9a07b';
      ctx.beginPath(); ctx.arc(1, -78, 11.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8f6b43';
      ctx.beginPath(); ctx.ellipse(-3, -84, 12, 6, -0.2, 0, Math.PI * 2); ctx.fill();

      // Iconic Full Sculpted Beard
      const bg = ctx.createLinearGradient(0, -76, 4, -44);
      bg.addColorStop(0, '#a67b4b'); bg.addColorStop(1, '#5e3f21');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(-6, -74);
      ctx.quadraticCurveTo(15, -72, 13, -55);
      ctx.quadraticCurveTo(6, -42, -5, -48);
      ctx.quadraticCurveTo(-11, -60, -6, -74);
      ctx.fill();

      // Armored Pauldron & Ornate Etched Greatsword
      const swingAng = (state === 'light' || state === 'heavy')
        ? -1.45 + (1 - player.stateTimer / Math.max(0.01, player.stateDur)) * 2.75
        : -0.35;
      ctx.save();
      ctx.translate(10, -56);
      ctx.rotate(swingAng);
      // Pauldron & forearm
      ctx.fillStyle = '#47301e';
      ctx.beginPath(); ctx.arc(0, 0, 9.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#c9933c'; ctx.lineWidth = 2; ctx.stroke();
      ctx.strokeStyle = '#5e3f27'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(18, 4); ctx.stroke();
      // Ornate Crossguard
      ctx.strokeStyle = '#e0ae48'; ctx.lineWidth = 4.5;
      ctx.beginPath(); ctx.moveTo(19, -9); ctx.lineTo(19, 17); ctx.stroke();
      // Massive Greatsword Blade
      const blg = ctx.createLinearGradient(20, 0, 74, 0);
      blg.addColorStop(0, '#a8b3bd'); blg.addColorStop(0.5, '#f2f6fa'); blg.addColorStop(1, '#ffcf70');
      ctx.fillStyle = blg;
      ctx.beginPath();
      ctx.moveTo(21, -4.5); ctx.lineTo(66, -3); ctx.lineTo(78, 3);
      ctx.lineTo(66, 9); ctx.lineTo(21, 10.5);
      ctx.closePath(); ctx.fill();
      // Etched fuller line
      ctx.strokeStyle = '#593b1a'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(24, 3); ctx.lineTo(60, 3); ctx.stroke();
      ctx.restore();
    }

    ctx.restore();
  }

  function drawEnemyFallback(e) {
    const sx = e.x - camX;
    const sy = e.z - e.y;
    const sc = e.scale;

    ctx.fillStyle = 'rgba(20, 7, 3, 0.45)';
    ctx.beginPath();
    ctx.ellipse(sx, e.z + 3, 24 * sc, 8 * sc, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    if (e.state === 'dead') ctx.globalAlpha = Math.max(0, e.timer / 0.55);
    ctx.translate(sx, sy);
    ctx.scale(e.facing * sc, sc);

    const bob = e.state === 'approach' ? Math.abs(Math.sin(e.animT)) * 5 : 0;
    const stride = e.state === 'approach' ? Math.sin(e.animT) * 11 : 0;
    ctx.translate(0, -bob);

    // Legs
    ctx.strokeStyle = '#211512'; ctx.lineWidth = 7.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6, -24); ctx.lineTo(-8 - stride, -2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6, -24); ctx.lineTo(8 + stride, -2); ctx.stroke();

    // Body color by enemy archetype
    const bodyCol = e.hurtFlash > 0 ? '#ffffff'
      : e.isBoss ? (e.phase === 2 ? '#8f1b0a' : '#2d1a14')
      : e.type === 'shield' ? '#222831'
      : e.type === 'zealot' ? '#6b2016'
      : '#4a291a';

    ctx.fillStyle = bodyCol;
    ctx.fillRect(-14, -60, 28, 38);
    ctx.strokeStyle = e.isBoss ? '#ffae38' : '#b37b36';
    ctx.lineWidth = 2;
    ctx.strokeRect(-14, -60, 28, 38);

    // Head / Helmet
    ctx.fillStyle = e.hurtFlash > 0 ? '#ffffff' : (e.isBoss ? '#d98f29' : '#3a2216');
    ctx.beginPath(); ctx.arc(0, -71, 10.5, 0, Math.PI * 2); ctx.fill();
    // Glowing eyes
    ctx.fillStyle = e.isBoss ? '#ff3b0a' : '#ffcf40';
    ctx.fillRect(3, -74, 5, 3);

    // Boss Sun Crown
    if (e.isBoss) {
      ctx.strokeStyle = '#ffd15c'; ctx.lineWidth = 2.5;
      for (let a = -1.2; a <= 1.2; a += 0.4) {
        ctx.beginPath();
        ctx.moveTo(Math.sin(a) * 10, -76 - Math.cos(a) * 6);
        ctx.lineTo(Math.sin(a) * 20, -78 - Math.cos(a) * 16);
        ctx.stroke();
      }
    }

    // Weapon
    const atkAng = e.state === 'windup' ? -1.1 : e.state === 'attack' ? 0.95 : 0.15;
    ctx.save();
    ctx.translate(8, -48);
    ctx.rotate(atkAng);
    ctx.strokeStyle = e.isBoss ? '#ff6a1a' : '#cbd5e1';
    ctx.lineWidth = e.type === 'zealot' ? 3.5 : 5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(e.type === 'zealot' ? 58 : e.isBoss ? 64 : 38, -8);
    ctx.stroke();
    ctx.restore();

    // Obsidian Shield (if intact)
    if (e.shield) {
      ctx.fillStyle = '#1b2029';
      ctx.strokeStyle = '#e0a943';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(10, -58, 12, 42, 4);
      ctx.fill(); ctx.stroke();
    }

    // Telegraph glint during windup
    if (e.state === 'windup') {
      ctx.fillStyle = 'rgba(255, 65, 25, 0.9)';
      ctx.beginPath(); ctx.arc(8, -84, 7 + Math.sin(worldTime * 35) * 2, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();

    // Mini HP bar for regular enemies
    if (!e.isBoss && e.state !== 'dead' && e.hp < e.maxHp) {
      const bw = 46;
      ctx.fillStyle = 'rgba(15, 6, 4, 0.78)';
      ctx.fillRect(sx - bw / 2, sy - 92 * sc, bw, 6);
      ctx.fillStyle = '#e83e1c';
      ctx.fillRect(sx - bw / 2 + 1, sy - 91 * sc, (bw - 2) * Math.max(0, e.hp / e.maxHp), 4);
    }
  }

  function drawPickup(pk) {
    // v12: painted objects lying in the scene (same sun, relit like every sprite, projected cast shadow + contact shadow).
    // A short hop out of the broken pot, then a very small settle-bob; a soft pulsing glow keeps it findable.
    const age = pk.age || 0, hop = age < 0.42 ? Math.sin(Math.PI * age / 0.42) * 24 : 0, bob = Math.sin(pk.bob) * 1.4;
    const meat = pk.type === 'meat', px = pk.x + 9, lift = hop + 0.5 + (age >= 0.42 ? bob + 1.4 : 0);
    const name = meat ? 'prop_meat' : 'prop_chalice', dh = meat ? 34 : 40;
    drawGroundShadow(px, pk.z, meat ? 15 : 11, meat ? 5 : 4, lift);
    const sx = px - camX, sy = pk.z - dh * 0.45 - lift, pul = 0.78 + 0.22 * Math.sin(worldTime * 3.4 + pk.x);
    const gl = ctx.createRadialGradient(sx, sy, 3, sx, sy, 28);
    gl.addColorStop(0, meat ? 'rgba(130, 255, 150, ' + (0.34 * pul) + ')' : 'rgba(255, 220, 90, ' + (0.42 * pul) + ')');
    gl.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gl;
    ctx.beginPath(); ctx.arc(sx, sy, 28, 0, Math.PI * 2); ctx.fill();
    if (drawWorldSprite(name, px, pk.z, lift, 1, dh, { cast: true })) return;
    if (meat) {
      ctx.fillStyle = '#a8341c';
      ctx.beginPath(); ctx.ellipse(sx, sy, 13, 8, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f5eedc';
      ctx.fillRect(sx + 9, sy - 3, 9, 5);
    } else {
      ctx.fillStyle = '#f5c23b';
      ctx.beginPath(); ctx.moveTo(sx - 9, sy - 10); ctx.lineTo(sx + 9, sy - 10);
      ctx.lineTo(sx + 4, sy + 2); ctx.lineTo(sx - 4, sy + 2); ctx.closePath(); ctx.fill();
      ctx.fillRect(sx - 6, sy + 5, 12, 4);
    }
  }

  // =========================================================================
  // CARVED STONE & GOLD HUD + TOUCH CONTROLS
  // =========================================================================
  // Colour grade + vignette, baked once per layout into a small canvas and stretched
  // (a full-screen 'soft-light' composite every frame was the single most expensive draw).
  const gradeCV = document.createElement('canvas');
  let gradeKey = '';
  function drawGrade() {
    if (!QUALITY.grade) return;
    const key = W + 'x' + H;
    if (gradeKey !== key) {
      gradeKey = key;
      const gw = 320, gh = Math.max(90, Math.round(320 * H / W));
      gradeCV.width = gw; gradeCV.height = gh;
      const g = gradeCV.getContext('2d');
      g.setTransform(gw / W, 0, 0, gh / H, 0, 0);
      const dl = g.createLinearGradient(0, 0, W, H);
      dl.addColorStop(0, 'rgba(255, 176, 90, 0.10)'); dl.addColorStop(0.45, 'rgba(255, 176, 90, 0)');
      dl.addColorStop(0.7, 'rgba(40, 12, 3, 0)'); dl.addColorStop(1, 'rgba(40, 12, 3, 0.20)');
      g.fillStyle = dl; g.fillRect(0, 0, W, H);
      const vg = g.createRadialGradient(W * 0.42, H * 0.46, H * 0.18, W * 0.5, H * 0.55, H * 0.92);
      vg.addColorStop(0, 'rgba(255, 140, 50, 0.05)');
      vg.addColorStop(0.65, 'rgba(70, 22, 4, 0.11)');
      vg.addColorStop(1, 'rgba(14, 3, 0, 0.48)');
      g.fillStyle = vg; g.fillRect(0, 0, W, H);
    }
    ctx.drawImage(gradeCV, 0, 0, W, H);
  }

  function drawBloomLights() {
    if (!QUALITY.bloom || (projectiles.length === 0 && slashArcs.length === 0)) return;
    const bw = Math.max(180, Math.round(W * 0.45));
    const bh = Math.max(100, Math.round(H * 0.45));
    if (bloomCV.width !== bw || bloomCV.height !== bh) {
      bloomCV.width = bw; bloomCV.height = bh;
    }
    const b = bloomCTX;
    b.setTransform(bw / W, 0, 0, bh / H, 0, 0);
    b.clearRect(0, 0, W, H);
    b.globalCompositeOperation = 'lighter';
    for (const pr of projectiles) {
      const px = pr.x - camX, py = pr.z - 42;
      const gr = b.createRadialGradient(px, py, 2, px, py, 48);
      gr.addColorStop(0, '#fff7cc');
      gr.addColorStop(0.4, pr.color || '#ffbe3b');
      gr.addColorStop(1, 'rgba(255,60,0,0)');
      b.fillStyle = gr;
      b.beginPath(); b.arc(px, py, 48, 0, Math.PI * 2); b.fill();
    }
    for (const s of slashArcs) {
      const t = s.life / s.maxLife;
      b.save();
      b.globalAlpha = t * 0.8;
      b.translate(s.x - camX, s.y);
      b.scale(s.facing, 1);
      b.strokeStyle = s.color1;
      b.lineWidth = (s.heavy ? 28 : 18) * t;
      b.lineCap = 'round';
      b.beginPath();
      b.arc(-10, 0, s.radius, -1.05, 0.85);
      b.stroke();
      b.restore();
    }
    b.globalCompositeOperation = 'source-over';
    // cheap blur: downsample to ~1/3 and let bilinear upscaling soften it (no ctx.filter)
    const sw2 = Math.max(48, Math.round(bw / 3)), sh2 = Math.max(28, Math.round(bh / 3));
    if (bloomCV2.width !== sw2 || bloomCV2.height !== sh2) { bloomCV2.width = sw2; bloomCV2.height = sh2; }
    bloomCTX2.clearRect(0, 0, sw2, sh2);
    bloomCTX2.drawImage(bloomCV, 0, 0, sw2, sh2);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.34;
    ctx.drawImage(bloomCV2, 0, 0, W, H);
    ctx.globalAlpha = 0.14;
    ctx.drawImage(bloomCV, 0, 0, W, H);
    ctx.restore();
  }

  function stonePanel(x, y, w, h, r) {
    ctx.fillStyle = 'rgba(22, 10, 5, 0.82)';
    ctx.strokeStyle = '#e0b050';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 230, 160, 0.28)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x + 4, y + 2);
    ctx.lineTo(x + w - 4, y + 2);
    ctx.stroke();
  }

  function drawPortraitMedallion(cx, cy, r, heroId, active) {
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fillStyle = '#241109'; ctx.fill();
    ctx.clip();

    const extImg = heroId === 'mzcookie' ? IMG.mzcookiePortrait : IMG.thebeardPortrait;
    if (extImg) {
      ctx.drawImage(extImg, cx - r, cy - r, r * 2, r * 2);
    } else if (heroId === 'mzcookie') {
      // Stylized MzCookie emblem
      ctx.fillStyle = '#140c0a';
      ctx.beginPath(); ctx.arc(cx, cy - 2, r * 0.78, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8b5134';
      ctx.beginPath(); ctx.arc(cx, cy - 1, r * 0.46, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f2c14e';
      ctx.beginPath(); ctx.ellipse(cx, cy + r * 0.65, r * 0.72, r * 0.36, 0, Math.PI, Math.PI * 2); ctx.fill();
    } else {
      // Stylized The Beard emblem
      ctx.fillStyle = '#4f331d';
      ctx.fillRect(cx - r, cy + 4, r * 2, r);
      ctx.fillStyle = '#d9a07b';
      ctx.beginPath(); ctx.arc(cx, cy - 5, r * 0.48, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8f6439';
      ctx.beginPath();
      ctx.moveTo(cx - r * 0.46, cy - 2);
      ctx.quadraticCurveTo(cx, cy + r * 0.95, cx + r * 0.46, cy - 2);
      ctx.fill();
    }
    ctx.restore();

    ctx.strokeStyle = active ? '#ffcf52' : '#7a5a32';
    ctx.lineWidth = active ? 3.2 : 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
  }

  function drawHUD() {
    stonePanel(10, 10, 272, 104, 10);
    const activeId = player.active;
    const benchId = activeId === 'mzcookie' ? 'thebeard' : 'mzcookie';
    const actH = HEROES[activeId];
    const actSt = roster[activeId];
    const benSt = roster[benchId];

    // Active Hero Panel
    drawPortraitMedallion(40, 42, 26, activeId, true);
    ctx.fillStyle = '#ffe599';
    ctx.font = 'bold 15px Georgia, serif';
    ctx.textAlign = 'left';
    ctx.fillText(actH.name, 74, 26);

    // HP Bar
    const barW = 190;
    ctx.fillStyle = 'rgba(20, 9, 5, 0.85)';
    ctx.fillRect(74, 32, barW, 14);
    const hpPct = Math.max(0, actSt.hp / actSt.maxHp);
    const hpg = ctx.createLinearGradient(74, 32, 74 + barW, 32);
    hpg.addColorStop(0, '#c42214'); hpg.addColorStop(1, '#ff6c26');
    ctx.fillStyle = hpg;
    ctx.fillRect(76, 34, (barW - 4) * hpPct, 10);
    ctx.strokeStyle = '#d9a13b'; ctx.lineWidth = 1.6;
    ctx.strokeRect(74, 32, barW, 14);

    // Fury / Rage Bar
    ctx.fillStyle = 'rgba(20, 9, 5, 0.85)';
    ctx.fillRect(74, 50, barW * 0.82, 9);
    const ragePct = player.rage / 100;
    ctx.fillStyle = player.rage >= 100
      ? (Math.floor(worldTime * 10) % 2 ? '#fff099' : '#ff6a14')
      : '#e8a229';
    ctx.fillRect(75, 51, (barW * 0.82 - 2) * ragePct, 7);
    ctx.strokeStyle = '#8f6428'; ctx.lineWidth = 1.2;
    ctx.strokeRect(74, 50, barW * 0.82, 9);
    if (player.rage >= 100) {
      ctx.fillStyle = '#fff0a6'; ctx.font = 'bold 11px sans-serif';
      ctx.fillText('FURY READY!', 74 + barW * 0.85, 58);
    }

    // Reserve Partner Mini Panel
    drawPortraitMedallion(32, 86, 15, benchId, false);
    ctx.fillStyle = '#d6be96'; ctx.font = 'bold 11px Georgia, serif';
    ctx.fillText(HEROES[benchId].name, 54, 83);
    ctx.fillStyle = 'rgba(20, 9, 5, 0.8)';
    ctx.fillRect(54, 87, 94, 7);
    ctx.fillStyle = '#47b863';
    ctx.fillRect(55, 88, 92 * Math.max(0, benSt.hp / benSt.maxHp), 5);

    // Score & Combo
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe599'; ctx.font = 'bold 16px Georgia, serif';
    {
      const sTxt = 'SCORE ' + String(score).padStart(6, '0');
      const sw = ctx.measureText(sTxt).width;
      if (hudBtns.length && W * 0.5 + sw * 0.5 > hudBtns[0].x - 8) {
        ctx.textAlign = 'right';
        ctx.fillText(sTxt, W - 12, 12 + UI.ph + 20);
        ctx.textAlign = 'center';
      } else ctx.fillText(sTxt, W * 0.5, 28);
    }

    if (comboCount >= 2) {
      ctx.fillStyle = '#ff9824'; ctx.font = 'bold 26px Georgia, serif';
      ctx.fillText(comboCount + ' HIT COMBO!', W * 0.5, 60);
    }

    // Boss HP Bar
    const boss = enemies.find(e => e.isBoss && e.state !== 'dead');
    if (boss) {
      const bw = Math.min(460, W * 0.62);
      const bx = (W - bw) * 0.5, by = bx < 292 ? 136 : 74;
      ctx.fillStyle = '#ffcf66'; ctx.font = 'bold 14px Georgia, serif';
      ctx.fillText(boss.name + (boss.phase === 2 ? ' — PHASE II' : ''), W * 0.5, by - 6);
      ctx.fillStyle = 'rgba(18, 6, 4, 0.88)';
      ctx.fillRect(bx, by, bw, 14);
      ctx.fillStyle = boss.phase === 2 ? '#ff330a' : '#d65315';
      ctx.fillRect(bx + 2, by + 2, (bw - 4) * Math.max(0, boss.hp / boss.maxHp), 10);
      ctx.strokeStyle = '#e5ae42'; ctx.lineWidth = 2;
      ctx.strokeRect(bx, by, bw, 14);
    }

    // Flashing GO -> Arrow
    if (goArrowTimer > 0 && Math.floor(worldTime * 5) % 2 === 0) {
      ctx.save();
      ctx.fillStyle = '#ffcf40';
      ctx.strokeStyle = '#401406'; ctx.lineWidth = 4;
      ctx.font = 'bold 28px Georgia, serif';
      ctx.textAlign = 'right';
      ctx.strokeText('GO  ➜', W - 36, H * 0.36);
      ctx.fillText('GO  ➜', W - 36, H * 0.36);
      ctx.restore();
    }

    // Zone / Ult Banner
    if (bannerTimer > 0) {
      const age = bannerDur - bannerTimer;
      const a = Math.min(1, bannerTimer * 1.4, age / 0.28);
      ctx.save();
      ctx.globalAlpha = a * a * (3 - 2 * a);
      ctx.fillStyle = 'rgba(26, 9, 4, 0.78)';
      ctx.fillRect(0, H * 0.24 - 24, W, 48);
      ctx.strokeStyle = '#e8b343'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, H * 0.24 - 24); ctx.lineTo(W, H * 0.24 - 24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, H * 0.24 + 24); ctx.lineTo(W, H * 0.24 + 24); ctx.stroke();
      ctx.fillStyle = '#ffe28a';
      ctx.font = 'bold 22px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20, 8, 2, 0.85)';
      ctx.strokeText(bannerText, W * 0.5, H * 0.24 + 8);
      ctx.fillText(bannerText, W * 0.5, H * 0.24 + 8);
      ctx.restore();
    }

    // Top-right Utility Pills (Touch toggle, Audio, Xbox status)
    for (const hb of hudBtns) {
      ctx.fillStyle = 'rgba(26, 11, 6, 0.76)';
      ctx.strokeStyle = '#b88535'; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.roundRect(hb.x, hb.y, hb.w, hb.h, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f7dfaa'; ctx.font = 'bold ' + Math.round(hb.h * 0.42) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(hb.label(), hb.x + hb.w * 0.5, hb.y + hb.h * 0.66);
    }
    if (gamepadConnected) {
      ctx.fillStyle = 'rgba(30, 82, 40, 0.85)';
      const gby = 12 + UI.ph + 6;
      ctx.beginPath(); ctx.roundRect(W - 188, gby, 176, 20, 5); ctx.fill();
      ctx.fillStyle = '#a3f7b5'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('XBOX CONTROLLER CONNECTED', W - 100, gby + 14);
    }

    if (showTouchUI) drawControlBubbles();
  }

  const BUBBLE_LABELS = {
    touch:    { light: ['ATK', ''], heavy: ['HVY', ''], jump: ['JMP', ''], dodge: ['DASH', ''], swap: ['SWAP', ''], ult: ['FURY', ''] },
    keyboard: { light: ['J', 'ATK'], heavy: ['K', 'HVY'], jump: ['SPACE', 'JMP'], dodge: ['L', 'DASH'], swap: ['Q', 'SWAP'], ult: ['U', 'FURY'] },
    gamepad:  { light: ['X', 'ATK'], heavy: ['Y', 'HVY'], jump: ['A', 'JMP'], dodge: ['B', 'DASH'], swap: ['LB', 'SWAP'], ult: ['LT', 'FURY'] }
  };
  const PAD_RING = { light: '#3b8be0', heavy: '#e6b92e', jump: '#43b24f', dodge: '#df4a42', swap: '#aab3bd', ult: '#aab3bd' };

  function fitText(txt, px, maxW, weight) {
    ctx.font = weight + ' ' + px + 'px sans-serif';
    while (px > 8 && ctx.measureText(txt).width > maxW) { px -= 1; ctx.font = weight + ' ' + px + 'px sans-serif'; }
    return px;
  }

  function drawKeycap(cx, cy, s, txt, lit) {
    ctx.fillStyle = lit ? 'rgba(255, 190, 70, 0.92)' : 'rgba(26, 11, 6, 0.78)';
    ctx.strokeStyle = lit ? '#fff0b0' : 'rgba(242, 193, 90, 0.9)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(cx - s / 2, cy - s / 2, s, s, s * 0.2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = lit ? '#2a1204' : '#fff2cf';
    ctx.font = 'bold ' + Math.round(s * 0.58) + 'px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(txt, cx, cy + s * 0.04);
    ctx.textBaseline = 'alphabetic';
  }

  function drawControlBubbles() {
    const mode = inputMode;
    const lab = BUBBLE_LABELS[mode] || BUBBLE_LABELS.touch;
    const sx = stick.id !== null ? stick.ox : 94;
    const sy = stick.id !== null ? stick.oy : H - 96;
    const kx = stick.id !== null ? stick.cx : sx;
    const ky = stick.id !== null ? stick.cy : sy;
    const hint = mode !== 'touch';

    // Movement stick / WASD cluster
    ctx.save();
    ctx.globalAlpha = stick.id !== null ? 0.8 : (hint ? 0.6 : 0.36);
    ctx.strokeStyle = '#f2c15a'; ctx.lineWidth = 2.5;
    ctx.fillStyle = 'rgba(24, 10, 5, 0.45)';
    ctx.beginPath(); ctx.arc(sx, sy, stick.maxR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    if (!hint || stick.id !== null) {
      ctx.fillStyle = '#ffbf47';
      ctx.beginPath(); ctx.arc(kx, ky, 22, 0, Math.PI * 2); ctx.fill();
    }
    if (hint) {
      ctx.globalAlpha = 0.9;
      if (mode === 'keyboard') {
        const s = Math.max(22, stick.maxR * 0.5), o = s * 0.98;
        drawKeycap(sx, sy - o, s, 'W', keys['KeyW'] || keys['ArrowUp']);
        drawKeycap(sx - o, sy, s, 'A', keys['KeyA'] || keys['ArrowLeft']);
        drawKeycap(sx, sy, s, 'S', keys['KeyS'] || keys['ArrowDown']);
        drawKeycap(sx + o, sy, s, 'D', keys['KeyD'] || keys['ArrowRight']);
        ctx.fillStyle = '#ffe9b8'; ctx.font = 'bold ' + Math.round(UI.lbl * 0.62) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20,8,2,0.85)';
        ctx.strokeText('WASD / ARROWS', sx, sy + stick.maxR + UI.lbl * 0.95);
        ctx.fillText('WASD / ARROWS', sx, sy + stick.maxR + UI.lbl * 0.95);
      } else {
        ctx.fillStyle = '#fff2cf'; ctx.textAlign = 'center';
        ctx.font = 'bold ' + Math.round(UI.lbl * 0.95) + 'px sans-serif';
        ctx.fillText('L-STICK', sx, sy - 2);
        ctx.font = 'bold ' + Math.round(UI.lbl * 0.6) + 'px sans-serif';
        ctx.fillText('or D-PAD', sx, sy + UI.lbl * 0.85);
      }
    }
    ctx.restore();

    // Action bubbles
    for (const b of touchBtns) {
      const isUlt = b.id === 'ult';
      const ultReady = player.rage >= 100;
      const L = lab[b.id] || [b.label, ''];
      ctx.save();
      ctx.globalAlpha = isUlt && !ultReady ? (hint ? 0.42 : 0.3) : (b.down ? 0.97 : (hint ? 0.82 : 0.64));
      const rad = b.down ? b.r * 0.91 : b.r;
      ctx.fillStyle = b.down ? b.col : 'rgba(26, 11, 6, 0.78)';
      ctx.strokeStyle = isUlt && ultReady ? '#fff08a' : (mode === 'gamepad' ? PAD_RING[b.id] : b.col);
      ctx.lineWidth = isUlt && ultReady ? 3.5 : 2.8;
      ctx.beginPath(); ctx.arc(b.x, b.y, rad, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#fff5d6';
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
      if (!L[1]) {
        const px = fitText(L[0], Math.round(UI.lbl), rad * 1.75, 'bold');
        ctx.fillText(L[0], b.x, b.y + px * 0.34);
      } else {
        const big = fitText(L[0], Math.round(UI.lbl * 1.25), rad * 1.6, 'bold');
        ctx.fillStyle = mode === 'gamepad' ? '#ffffff' : '#ffe27a';
        ctx.fillText(L[0], b.x, b.y + big * 0.06);
        const sm = Math.max(9, Math.round(UI.lbl * 0.58));
        ctx.font = 'bold ' + sm + 'px sans-serif'; ctx.fillStyle = '#e9d3a6';
        ctx.fillText(L[1], b.x, b.y + big * 0.06 + sm * 1.15);
      }
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  function drawTitleOrEnd() {
    drawBackground();
    // Dark cinematic vignette
    ctx.fillStyle = 'rgba(18, 6, 3, 0.62)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    if (gameState === 'title') {
      // Gold embossed title
      ctx.fillStyle = '#ffcf5c';
      ctx.strokeStyle = '#381004'; ctx.lineWidth = 7;
      ctx.font = `bold ${W < 820 ? 48 : 62}px Georgia, serif`;
      ctx.strokeText('EMPIRE OF SAND', W * 0.5, H * 0.34);
      ctx.fillText('EMPIRE OF SAND', W * 0.5, H * 0.34);

      ctx.fillStyle = '#f5d79c'; ctx.font = 'italic 20px Georgia, serif';
      ctx.fillText('Starring MzCookie & The Beard', W * 0.5, H * 0.43);

      // Portraits preview
      drawPortraitMedallion(W * 0.5 - 56, H * 0.56, 34, 'mzcookie', true);
      drawPortraitMedallion(W * 0.5 + 56, H * 0.56, 34, 'thebeard', true);

      // Pulsing Start Prompt
      ctx.globalAlpha = 0.75 + Math.sin(worldTime * 5) * 0.25;
      ctx.font = 'bold 21px Georgia, serif';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20, 8, 2, 0.85)'; ctx.fillStyle = '#ffe58f';
      const promptTxt = LOAD.ready ? 'TAP SCREEN • PRESS ENTER • PRESS XBOX A TO FIGHT'
        : 'FORGING THE EMPIRE…  ' + Math.round(100 * LOAD.done / Math.max(1, LOAD.total)) + '%';
      ctx.strokeText(promptTxt, W * 0.5, H * 0.74);
      ctx.fillText(promptTxt, W * 0.5, H * 0.74);
      ctx.globalAlpha = 1;

      ctx.fillStyle = '#e8c99a'; ctx.font = '13px sans-serif';
      ctx.fillText('KB: WASD Move | J Atk | K Heavy | Space Jump | L Dash | Q Swap | U Fury', W * 0.5, H * 0.85);
      ctx.fillText('XBOX: Stick Move | X Atk | Y Heavy | A Jump | B Dash | LB/RB Swap | LT/RT Fury', W * 0.5, H * 0.90);
    } else {
      // Victory plaque (the finale skips LEVEL CLEAR so this is the only end card)
      const ready = SCREEN.lock <= 0;
      ctx.fillStyle = '#ffd45c';
      ctx.strokeStyle = '#290904'; ctx.lineWidth = 6;
      ctx.font = 'bold ' + (W < 820 ? 40 : 54) + 'px Georgia, serif';
      const title = 'THE EMPIRE IS YOURS';
      ctx.strokeText(title, W * 0.5, H * 0.34);
      ctx.fillText(title, W * 0.5, H * 0.34);

      ctx.fillStyle = '#ffe8b3'; ctx.font = 'bold 24px Georgia, serif';
      ctx.fillText('FINAL SCORE: ' + score, W * 0.5, H * 0.48);
      if (SCREEN.data && SCREEN.data.kills != null) {
        ctx.fillStyle = '#f5d79c'; ctx.font = 'bold 18px Georgia, serif';
        ctx.fillText('ENEMIES DEFEATED: ' + SCREEN.data.kills, W * 0.5, H * 0.56);
      }

      ctx.globalAlpha = ready ? (0.75 + Math.sin(worldTime * 5) * 0.25) : 0.45;
      ctx.font = 'bold 20px Georgia, serif';
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20, 8, 2, 0.85)'; ctx.fillStyle = '#ffe58f';
      const prompt = 'PRESS ENTER OR TAP TO TRY AGAIN';
      ctx.strokeText(prompt, W * 0.5, H * 0.70);
      ctx.fillText(prompt, W * 0.5, H * 0.70);
      ctx.globalAlpha = 1;
    }
  }

  function drawResultOverlay() {
    const vis = SCREEN.fade;
    if (vis < 0.01) return;
    const d = SCREEN.data || {};
    const over = gameState === 'gameover';
    const narrow = W < 820 || H < 460;
    const titlePx = narrow ? (W < 700 ? 30 : 38) : 50;
    const bodyPx = narrow ? 16 : 20;
    const gap = narrow ? 22 : 28;

    ctx.save();
    ctx.globalAlpha = vis;
    const vg = ctx.createRadialGradient(W * 0.5, H * 0.48, H * 0.08, W * 0.5, H * 0.5, H * 0.9);
    vg.addColorStop(0, 'rgba(18, 6, 3, 0.84)');
    vg.addColorStop(0.55, 'rgba(16, 5, 2, 0.72)');
    vg.addColorStop(1, 'rgba(8, 2, 0, 0.50)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);

    // Carved gold plaque, same chrome as the HUD / title
    const lines = over ? 4 : (d.heal ? 7 : 6);
    const padY = narrow ? 22 : 28;
    const pw = Math.min(540, W - 36);
    const ph = padY * 2 + titlePx + 10 + lines * gap + 8;
    const px = (W - pw) * 0.5, py = Math.max(16, Math.min(H - ph - 16, H * 0.46 - ph * 0.5));
    stonePanel(px, py, pw, ph, 12);

    let y = py + padY + titlePx * 0.75;
    ctx.textAlign = 'center';
    ctx.lineWidth = 6; ctx.strokeStyle = '#290904';
    ctx.fillStyle = over ? '#ff5a38' : '#ffd45c';
    ctx.font = 'bold ' + titlePx + 'px Georgia, serif';
    const head = over ? 'FALLEN IN THE SAND' : 'LEVEL CLEAR';
    ctx.strokeText(head, W * 0.5, y);
    ctx.fillText(head, W * 0.5, y);
    y += titlePx * 0.35 + gap;

    ctx.fillStyle = '#f5d79c';
    ctx.font = 'italic ' + Math.round(bodyPx * 0.95) + 'px Georgia, serif';
    ctx.fillText(over ? (d.zone || zoneLabel(zoneIdx)) : (d.title || ''), W * 0.5, y);
    y += gap;

    ctx.fillStyle = '#ffe8b3';
    ctx.font = 'bold ' + bodyPx + 'px Georgia, serif';
    if (over) {
      ctx.fillText('FINAL SCORE: ' + (d.score != null ? d.score : score), W * 0.5, y); y += gap;
      ctx.fillText('ENEMIES DEFEATED: ' + (d.kills != null ? d.kills : kills), W * 0.5, y); y += gap;
    } else {
      ctx.fillText('SCORE: ' + (d.score != null ? d.score : 0), W * 0.5, y); y += gap;
      ctx.fillText('ENEMIES DEFEATED: ' + (d.kills != null ? d.kills : 0), W * 0.5, y); y += gap;
      // Remaining health of both heroes, stacked, painted like the HUD bars
      const hp = d.hp || hpSnap();
      const rowW = Math.min(400, pw - 64);
      const hx = W * 0.5 - rowW * 0.5;
      for (const id of ['mzcookie', 'thebeard']) {
        const h = hp[id]; if (!h) continue;
        drawPortraitMedallion(hx + 12, y - 2, 12, id, id === (player && player.active));
        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffe599'; ctx.font = 'bold ' + Math.round(bodyPx * 0.78) + 'px Georgia, serif';
        ctx.fillText(h.name, hx + 30, y - 6);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#f5d79c'; ctx.font = 'bold ' + Math.round(bodyPx * 0.72) + 'px Georgia, serif';
        ctx.fillText(h.hp + ' / ' + h.max, hx + rowW, y - 6);
        const bx = hx + 30, by = y, bw = rowW - 30;
        ctx.fillStyle = 'rgba(20, 9, 5, 0.85)'; ctx.fillRect(bx, by, bw, 8);
        const hpg = ctx.createLinearGradient(bx, by, bx + bw, by);
        hpg.addColorStop(0, '#c42214'); hpg.addColorStop(1, '#ff6c26');
        ctx.fillStyle = hpg; ctx.fillRect(bx + 1, by + 1, (bw - 2) * Math.max(0, h.hp / Math.max(1, h.max)), 6);
        ctx.strokeStyle = '#d9a13b'; ctx.lineWidth = 1.2; ctx.strokeRect(bx, by, bw, 8);
        y += gap * 0.95;
      }
      ctx.textAlign = 'center';
      y += 6;
      if (d.heal) {
        ctx.fillStyle = '#7dff9a';
        ctx.font = 'bold ' + bodyPx + 'px Georgia, serif';
        ctx.fillText(d.heal, W * 0.5, y);
        y += gap;
      }
    }

    const ready = screenReady();
    ctx.globalAlpha = vis * (ready ? (0.75 + Math.sin(worldTime * 5) * 0.25) : 0.45);
    ctx.font = 'bold ' + Math.round(bodyPx * 0.95) + 'px Georgia, serif';
    ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20, 8, 2, 0.85)'; ctx.fillStyle = '#ffe58f';
    const prompt = over ? 'PRESS ENTER OR TAP TO TRY AGAIN' : 'PRESS ENTER OR TAP TO CONTINUE';
    ctx.strokeText(prompt, W * 0.5, y);
    ctx.fillText(prompt, W * 0.5, y);
    ctx.restore();
  }

  const RL = [], RLs = []; let RLn = 0;
  function rlPush(z, kind, ref) {
    let o = RL[RLn]; if (!o) o = RL[RLn] = { z: 0, kind: 0, ref: null };
    o.z = z; o.kind = kind; o.ref = ref; RLn++; RLs.push(o);
  }
  function rlCmp(a, b) { return a.z - b.z; }

  function render() {
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    if (LOAD.warm.length) {   // pre-upload decoded art to the GPU at full size before it is first needed
      const n = Math.min(gameState === 'playing' ? 1 : 4, LOAD.warm.length);
      ctx.save(); ctx.globalAlpha = 0.003;
      for (let i = 0; i < n; i++) {
        const im = LOAD.warm.shift();
        try { ctx.drawImage(im, 0, 0, im.naturalWidth || im.width, im.naturalHeight || im.height); } catch (_) {}
      }
      ctx.restore();
    }
    if (LOAD.ready && !BAKED.ready) bakeLateArt();
    if (FLAME.baked < FL_N && BAKED.glow) { flBakeStep(4); PERF_SKIP = true; }
    if (LITQ.length) { bakeLitOne(); PERF_SKIP = true; }
    else if (LOAD.ready && !LIT_PRE && gameState !== 'playing') {   // pre-light the sprites this screen will use
      LIT_PRE = true;
      for (const k of ['mzcookie_idle', 'mzcookie_attack', 'thebeard_idle', 'thebeard_attack', 'marauder', 'shield', 'zealot', 'boss', 'urn', 'prop_urnbroken', 'prop_meat', 'prop_chalice',
                       'walk_mzcookie', 'walk_thebeard', 'walk_marauder', 'walk_shield', 'walk_zealot', 'walk_boss'])
        for (const h of [52, 112, 121, 124, 132, 183]) pickImg(k, h);
    }

    if (gameState === 'title' || gameState === 'victory') {
      drawTitleOrEnd();
      return;
    }

    ctx.save();
    if (shakeMag > 0.4) {
      const st = worldTime * 38;
      ctx.translate((Math.sin(st) * 0.6 + Math.sin(st * 2.3 + 1.7) * 0.4) * shakeMag * 0.55,
                    (Math.sin(st * 1.7 + 0.5) * 0.6 + Math.sin(st * 3.1) * 0.4) * shakeMag * 0.45);
    }

    drawBackground();
    ambientDraw('behind');

    // Depth-sorted entities (Urns, Pickups, Player, Enemies) — pooled, allocation-free
    RLs.length = 0; RLn = 0;
    for (const u of urns) rlPush(u.broken ? u.z - 1 : u.z, 1, u);
    for (const pk of pickups) rlPush(pk.z, 2, pk);
    for (const e of enemies) rlPush(e.z, 3, e);
    rlPush(player.z, 4, player);
    RLs.sort(rlCmp);
    for (let i = 0; i < RLs.length; i++) {
      const it = RLs[i];
      if (it.kind === 1) drawUrn(it.ref);
      else if (it.kind === 2) drawPickup(it.ref);
      else if (it.kind === 3) drawEnemy(it.ref);
      else {
        for (const ai of player.afterimages) {
          ctx.save();
          ctx.globalAlpha = (ai.life / 0.16) * 0.45;
          drawHero(ai.x, ai.z, ai.y, ai.facing, player.active, 'dodge', 0, 0, true);
          ctx.restore();
        }
        drawHero(player.x, player.z, player.y, player.facing, player.active, player.state, player.animT, player.invuln);
      }
    }
    ambientDraw('front');

    // Painted Weapon Smear Arcs
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const s of slashArcs) {
      const t = s.life / s.maxLife;
      ctx.save();
      ctx.globalAlpha = t * 0.88;
      ctx.translate(s.x - camX, s.y);
      ctx.scale(s.facing, 1);
      ctx.strokeStyle = s.color1;
      ctx.lineWidth = s.heavy ? 18 * t : 11 * t;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(-10, 0, s.radius, -1.05, 0.85);
      ctx.stroke();
      ctx.strokeStyle = s.color2;
      ctx.lineWidth = s.heavy ? 7 * t : 4 * t;
      ctx.beginPath();
      ctx.arc(-10, 0, s.radius * 0.88, -0.95, 0.78);
      ctx.stroke();
      ctx.restore();
    }

    // Projectiles — soft additive solar / fire orbs
    for (const pr of projectiles) {
      const px = pr.x - camX, py = pr.z - 42;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const R = pr.heavy ? 52 : 40;
      const gr = ctx.createRadialGradient(px, py, 1, px, py, R);
      gr.addColorStop(0, '#fffce8');
      gr.addColorStop(0.16, pr.color || '#ffbe3b');
      gr.addColorStop(0.5, 'rgba(255, 90, 16, 0.45)');
      gr.addColorStop(1, 'rgba(255, 40, 0, 0)');
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff8d0';
      ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI * 2); ctx.fill();
      if (pr.vx) {
        ctx.strokeStyle = 'rgba(255, 220, 140, 0.45)';
        ctx.lineWidth = 5; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px - Math.sign(pr.vx) * 28, py);
        ctx.stroke();
      }
      ctx.restore();
    }

    ctx.restore();

    // Impact Particles
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.size, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }


    drawForegroundParallax();

    // Floating Damage / Callout Text
    for (const f of floatTexts) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, f.life * 1.8);
      ctx.font = `bold ${f.size}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#240903'; ctx.lineWidth = 3.5;
      ctx.strokeText(f.text, f.x - camX, f.y);
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x - camX, f.y);
      ctx.restore();
    }

    ctx.restore();

    // Screen Flash
    if (flashAlpha > 0.01) {
      ctx.fillStyle = flashColor;
      ctx.globalAlpha = flashAlpha;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    drawBloomLights();
    drawGrade();
    if (gameState === 'playing') drawHUD();
    else drawResultOverlay();
  }

  // =========================================================================
  // BOOT
  // =========================================================================
  bakeTextures();
  bakeFx();
  initEmbers();
  initDust();
  bakeAmbient();
  resize();
  window.addEventListener('resize', resize);
  ambientSync(true);

  let lastT = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    frameDt = dt; frameNo++;
    update(dt);
    render();
    notePerf(dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});</script></body>
